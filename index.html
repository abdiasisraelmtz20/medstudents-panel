<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedStudents · Panel de Control</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap');
  .msadm{
    --navy:#042D5A; --navy-deep:#021D3D; --navy-soft:#0A3D73;
    --red:#EF4150; --gold:#C8A84B; --gold-soft:#E5D5A3;
    --bg:#F3F5F9; --card:#FFFFFF; --line:#E2E7F0;
    --ink:#1B2A41; --ink-soft:#5A6B84; --ok:#1E9E6A; --warn:#D98E04;
    --r:14px; --shadow:0 1px 3px rgba(4,45,90,.08),0 8px 24px rgba(4,45,90,.06);
  }
  .msadm,.msadm *{margin:0;padding:0;box-sizing:border-box}
  .msadm{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px}
  .msadm .app{display:flex;min-height:100vh}

  /* ---------- Sidebar ---------- */
  .msadm .side{width:232px;background:linear-gradient(180deg,var(--navy) 0%,var(--navy-deep) 100%);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:20;flex-shrink:0}
  .msadm .brand{padding:20px 16px 16px;border-bottom:1px solid rgba(255,255,255,.1);text-align:center}
  .msadm .brand-logo{width:88px;max-width:80%;display:block;margin:0 auto 10px}
  .msadm .foot-perfil{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .msadm .foot-foto{width:42px;height:42px;border-radius:50%;object-fit:cover;object-position:center top;border:2px solid var(--gold);flex-shrink:0}
  .msadm .lock-logo{width:96px;display:block;margin:0 auto 14px}
  .msadm .hero{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
  .msadm .hcard{border-radius:var(--r);padding:22px 26px;box-shadow:var(--shadow)}
  .msadm .hcard.ing{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-deep) 100%);color:#fff}
  .msadm .hcard.pend{background:#fff;border:1px solid var(--line);border-left:6px solid var(--red)}
  .msadm .hcard .hlab{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;font-weight:800;opacity:.85}
  .msadm .hcard.pend .hlab{color:var(--ink-soft)}
  .msadm .hval{font-size:46px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums;margin-top:6px}
  .msadm .hcard.ing .hval{color:var(--gold)}
  .msadm .hcard.pend .hval{color:var(--red)}
  .msadm .hcard .hsub{font-size:12.5px;margin-top:4px;opacity:.75}
  .msadm .brand h1{font-size:17px;letter-spacing:2.5px;font-weight:800}
  .msadm .brand h1 span{color:var(--red)}
  .msadm .brand p{font-size:10.5px;letter-spacing:1.8px;color:var(--gold);text-transform:uppercase;margin-top:4px}
  .msadm .nav{display:block;flex:1;padding:14px 10px;overflow-y:auto;margin:0;list-style:none;flex-wrap:nowrap}
  .msadm .nav button{display:flex;align-items:center;gap:11px;width:100%;padding:11px 13px;margin-bottom:3px;background:none;border:none;border-radius:10px;color:rgba(255,255,255,.72);font-size:13.5px;font-weight:600;cursor:pointer;text-align:left;transition:.15s}
  .msadm .nav button:hover{background:rgba(255,255,255,.08);color:#fff}
  .msadm .nav button.on{background:rgba(255,255,255,.10);color:#fff}
  .msadm .nav button{position:relative}
  .msadm .nav button.on::before{content:'';position:absolute;left:0;top:22%;bottom:22%;width:3px;border-radius:99px;background:var(--gold)}
  .msadm .nav button .ic{width:20px;text-align:center;font-size:15px}
  .msadm .nav .sep{margin:12px 13px 8px;font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:rgba(255,255,255,.35)}
  .msadm .side-foot{padding:14px 20px;font-size:11px;color:rgba(255,255,255,.45);border-top:1px solid rgba(255,255,255,.1)}

  /* ---------- Main ---------- */
  .msadm .main{flex:1;padding:26px 30px 60px;max-width:1400px;min-width:0}
  .msadm .topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px;flex-wrap:wrap}
  .msadm .topbar h2{font-size:22px;font-weight:800;color:var(--navy)}
  .msadm .topbar .sub{font-size:12.5px;color:var(--ink-soft);margin-top:3px}
  .msadm .actions{display:flex;gap:9px;flex-wrap:wrap}

  .msadm .btn{display:inline-flex;align-items:center;gap:7px;line-height:1.3;text-align:center;vertical-align:middle;text-decoration:none;user-select:none;padding:9px 15px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--navy);font-size:13px;font-weight:700;cursor:pointer;transition:.15s}
  .msadm .btn:hover{border-color:var(--navy);box-shadow:var(--shadow)}
  .msadm .btn.pri{background:var(--red);border-color:var(--red);color:#fff}
  .msadm .btn.pri:hover{background:#d9333f}
  .msadm .btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
  .msadm .btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
  .msadm .btn.ghost{border:none;background:none;padding:5px 7px}
  .msadm .btn.danger{color:var(--red)}

  /* ---------- KPI cards ---------- */
  .msadm .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
  .msadm .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .msadm .kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--navy)}
  .msadm .kpi.gold::before{background:var(--gold)}
  .msadm .kpi.red::before{background:var(--red)}
  .msadm .kpi.ok::before{background:var(--ok)}
  .msadm .kpi .lab{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-soft);font-weight:700}
  .msadm .kpi .val{font-size:24px;font-weight:800;color:var(--navy);margin-top:6px;font-variant-numeric:tabular-nums}
  .msadm .kpi .val.money{color:var(--navy)}
  .msadm .kpi .val.neg{color:var(--red)}
  .msadm .kpi .hint{font-size:11.5px;color:var(--ink-soft);margin-top:4px}

  /* ---------- Cards / tables ---------- */
  .msadm .card{display:block;position:static;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden;min-width:0}
  .msadm .card .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .msadm .card .hd h3{font-size:14.5px;font-weight:800;color:var(--navy)}
  .msadm .card .bd{padding:16px 18px}
  .msadm .tbl-wrap{overflow-x:auto}
  .msadm table{width:100%;border-collapse:collapse;font-size:13px}
  .msadm th{background:#F7F9FC;color:var(--ink-soft);font-size:10.5px;letter-spacing:1px;text-transform:uppercase;font-weight:800;padding:10px 12px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
  .msadm td{padding:10px 12px;border-bottom:1px solid #EEF1F7;vertical-align:middle;white-space:nowrap}
  .msadm tr:last-child td{border-bottom:none}
  .msadm tbody tr:hover{background:#FAFBFE}
  .msadm td.num,.msadm th.num{text-align:right;font-variant-numeric:tabular-nums}
  .msadm .tname{font-weight:700;color:var(--navy)}
  .msadm .tsub{font-size:11.5px;color:var(--ink-soft)}

  .msadm .pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:800;letter-spacing:.3px}
  .msadm .pill.ok{background:#E3F5EC;color:var(--ok)}
  .msadm .pill.warn{background:#FBF0DA;color:var(--warn)}
  .msadm .pill.bad{background:#FDE7E9;color:var(--red)}
  .msadm .pill.navy{background:#E4EBF5;color:var(--navy)}
  .msadm .pill.gold{background:#F5EED9;color:#8A7226}
  .msadm .pill.gray{background:#EDF0F5;color:var(--ink-soft)}

  .msadm .empty{padding:44px 20px;text-align:center;color:var(--ink-soft)}
  .msadm .empty .big{font-size:34px;margin-bottom:10px}
  .msadm .empty b{color:var(--navy)}
  .msadm .empty p{margin-top:6px;font-size:13px}

  /* ---------- Charts ---------- */
  .msadm .bars{display:flex;flex-direction:column;gap:10px}
  .msadm .bar-row{display:grid;grid-template-columns:150px 1fr 110px;gap:12px;align-items:center}
  .msadm .bar-row .bl{font-size:12.5px;font-weight:700;color:var(--navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .msadm .bar-track{background:#EDF1F7;border-radius:99px;height:14px;overflow:hidden}
  .msadm .bar-fill{height:100%;background:linear-gradient(90deg,var(--navy-soft),var(--navy));border-radius:99px;min-width:2px}
  .msadm .bar-fill.gold{background:linear-gradient(90deg,#D9BE6E,var(--gold))}
  .msadm .bar-row .bv{font-size:12.5px;font-weight:800;color:var(--navy);text-align:right;font-variant-numeric:tabular-nums}
  .msadm .mchart{display:flex;gap:14px;align-items:flex-end;height:160px;padding-top:8px}
  .msadm .mcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
  .msadm .mcol .pair{flex:1;display:flex;gap:4px;align-items:flex-end;width:100%;justify-content:center}
  .msadm .mcol .stick{width:22px;border-radius:6px 6px 2px 2px;min-height:2px}
  .msadm .mcol .stick.in{background:var(--navy)}
  .msadm .mcol .stick.out{background:var(--red)}
  .msadm .mcol .ml{font-size:11px;color:var(--ink-soft);font-weight:700}
  .msadm .legend{display:flex;gap:16px;font-size:11.5px;color:var(--ink-soft);margin-top:10px}
  .msadm .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}

  /* ---------- Forms / modal ---------- */
  .msadm .overlay{position:fixed;inset:0;margin:0;width:auto;height:auto;background:rgba(2,29,61,.55);display:none;align-items:flex-start;justify-content:center;padding:20px 16px;z-index:2147483000;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .msadm .overlay.show{display:flex}
  .msadm .modal{display:flex;flex-direction:column;position:relative;top:auto;left:auto;right:auto;bottom:auto;height:auto;max-height:calc(100vh - 40px);width:100%;max-width:560px;overflow:hidden;z-index:auto;margin:auto;background:#fff;border-radius:16px;box-shadow:0 24px 60px rgba(2,29,61,.35);animation:msadmPop .18s ease;outline:0}
  .msadm .modal form{display:flex;flex-direction:column;min-height:0;flex:1}
  .msadm .modal .mh{flex-shrink:0}
  .msadm .modal .mf{flex-shrink:0}
  @keyframes msadmPop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
  .msadm .modal .mh{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
  .msadm .modal .mh h3{font-size:16px;font-weight:800;color:var(--navy)}
  .msadm .modal .mb{padding:20px 22px;display:grid;grid-template-columns:1fr 1fr;gap:14px;overflow-y:auto;min-height:0;flex:1;-webkit-overflow-scrolling:touch}
  .msadm .modal .mf{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--line)}
  .msadm .fld{display:flex;flex-direction:column;gap:5px}
  .msadm .fld.full{grid-column:1/-1}
  .msadm .fld label{font-size:11px;letter-spacing:.8px;text-transform:uppercase;font-weight:800;color:var(--ink-soft)}
  .msadm .fld input,.msadm .fld select,.msadm .fld textarea{padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;font-family:inherit;color:var(--ink);background:#fff;width:100%}
  .msadm .fld input:focus,.msadm .fld select:focus,.msadm .fld textarea:focus{outline:2px solid var(--navy);outline-offset:-1px}
  .msadm .fld .chk{display:flex;align-items:center;gap:8px;padding:9px 0;font-size:13px;font-weight:600;color:var(--ink)}
  .msadm .fld .chk input{width:17px;height:17px;accent-color:var(--red)}

  .msadm .search{padding:9px 13px;border:1px solid var(--line);border-radius:10px;font-size:13.5px;min-width:230px;font-family:inherit}
  .msadm .search:focus{outline:2px solid var(--navy);outline-offset:-1px}
  .msadm select.filter{padding:8px 11px;border:1px solid var(--line);border-radius:10px;font-size:13px;font-weight:600;color:var(--navy);background:#fff;font-family:inherit}

  .msadm .toast{position:fixed;top:auto;left:auto;bottom:24px;right:24px;width:auto;pointer-events:auto;border:none;background:var(--navy);color:#fff;padding:13px 20px;border-radius:12px;font-size:13.5px;font-weight:700;box-shadow:0 10px 30px rgba(2,29,61,.4);z-index:99;display:none;max-width:340px}
  .msadm .toast.show{display:block;animation:msadmPop .2s ease}
  .msadm .toast.err{background:var(--red)}

  .msadm .wa{color:var(--ok);font-weight:800;text-decoration:none;font-size:12.5px}
  .msadm .wa:hover{text-decoration:underline}
  .msadm .avatar{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:var(--navy);color:var(--gold);font-size:12px;font-weight:800;margin-right:10px;flex-shrink:0}
  .msadm .prog{background:#EDF1F7;border-radius:99px;height:7px;width:90px;overflow:hidden;display:inline-block;vertical-align:middle}
  .msadm .prog i{display:block;height:100%;background:var(--ok);border-radius:99px}
  .msadm .prog i.p{background:var(--warn)}

  .msadm .grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media(max-width:1050px){.msadm .grid2{grid-template-columns:1fr}}
  @media(max-width:820px){
    .msadm .side{width:64px}
    .msadm .brand h1,.msadm .brand p,.msadm .nav button span.tx,.msadm .nav .sep,.msadm .side-foot{display:none}
    .msadm .brand-logo{width:40px;margin-bottom:0}
    .msadm .hero{grid-template-columns:1fr}
    .msadm .hval{font-size:32px}
    .msadm .nav button{justify-content:center}
    .msadm .main{padding:18px 14px 60px}
    .msadm .modal .mb{grid-template-columns:1fr}
    .msadm .bar-row{grid-template-columns:100px 1fr 90px}
  }
  .msadm .lock{position:fixed;inset:0;z-index:60;background:linear-gradient(160deg,var(--navy) 0%,var(--navy-deep) 100%);display:flex;align-items:center;justify-content:center;padding:20px}
  .msadm .lock.oculto{display:none}
  .msadm .lock .caja{background:#fff;border-radius:18px;padding:38px 42px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.45);max-width:360px;width:100%}
  .msadm .lock h3{color:var(--navy);letter-spacing:2.5px;font-size:16px;font-weight:800}
  .msadm .lock h3 span{color:var(--red)}
  .msadm .lock p{color:var(--ink-soft);font-size:12.5px;margin:8px 0 20px}
  .msadm .lock input{width:190px;text-align:center;font-size:34px;letter-spacing:18px;padding:10px 0 10px 18px;border:2px solid var(--line);border-radius:12px;font-family:inherit;color:var(--navy)}
  .msadm .lock input:focus{outline:none;border-color:var(--navy)}
  .msadm .lock .err{color:var(--red);font-size:12.5px;font-weight:700;margin-top:12px;min-height:16px}
  .msadm .lock .caja.mal{animation:msadmShake .35s}
  @keyframes msadmShake{20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
  @media print{.msadm .side,.msadm .actions,.msadm .btn,.msadm .wa,.msadm .topbar .actions{display:none!important}.msadm .main{padding:10px!important;max-width:none}.msadm .card{box-shadow:none;break-inside:avoid}}
  .msadm ::-webkit-scrollbar{width:10px;height:10px}
  .msadm ::-webkit-scrollbar-thumb{background:#C6CFDD;border-radius:99px}
  /* ============ PIEL CORPORATIVA MEDSTUDENTS ============ */
  .msadm{font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif}
  .msadm .topbar h2,.msadm .hval,.msadm .kpi .val,.msadm .lock h3{font-family:'Playfair Display',Georgia,'Times New Roman',serif}
  /* --- menú lateral: navy profundo con filo dorado --- */
  .msadm .side{background:linear-gradient(178deg,#07386E 0%,var(--navy) 34%,var(--navy-deep) 100%);box-shadow:inset -1px 0 0 rgba(200,168,75,.22)}
  .msadm .side::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold),#EBDCA9,var(--gold))}
  .msadm .brand{padding:30px 14px 24px;border-bottom:1px solid rgba(200,168,75,.30)}
  .msadm .brand-logo{width:132px;max-width:90%;filter:drop-shadow(0 8px 22px rgba(0,0,0,.5))}
  .msadm .brand-txt{display:none}
  .msadm .nav{display:block;padding:16px 12px}
  .msadm .nav button{font-size:13px;border-radius:12px;padding:11px 14px}
  .msadm .nav button.on{background:rgba(255,255,255,.10);box-shadow:inset 0 0 0 1px rgba(200,168,75,.22)}
  .msadm .nav .sep{color:rgba(200,168,75,.6);letter-spacing:2.4px;font-size:9.5px}
  .msadm .side-foot{border-top:1px solid rgba(200,168,75,.30);padding:18px 18px 20px;font-size:11px}
  .msadm .foot-perfil{gap:13px;margin-bottom:10px}
  .msadm .foot-foto{width:68px;height:68px;border:2px solid var(--gold);box-shadow:0 0 0 4px rgba(200,168,75,.20),0 10px 22px rgba(0,0,0,.45)}
  .msadm .foot-perfil b{font-size:13.5px;letter-spacing:.3px}
  /* --- encabezados de sección --- */
  .msadm .topbar h2{font-size:29px;letter-spacing:.3px}
  .msadm .topbar .sub{letter-spacing:.4px;margin-top:4px}
  /* --- tarjetas --- */
  .msadm .card{border-radius:16px;border-color:#E5EAF3;box-shadow:0 1px 2px rgba(4,45,90,.05),0 14px 36px rgba(4,45,90,.09)}
  .msadm .card .hd{padding:16px 20px;background:linear-gradient(180deg,#FBFCFE,#fff)}
  .msadm .card .hd h3{text-transform:uppercase;font-size:11.5px;letter-spacing:2px}
  /* --- hero: cifras protagonistas --- */
  .msadm .hero{gap:16px;margin-bottom:16px}
  .msadm .hcard{border-radius:18px;padding:28px 32px;position:relative;overflow:hidden}
  .msadm .hcard.ing{box-shadow:0 20px 46px rgba(4,45,90,.38)}
  .msadm .hcard.ing::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 86% 12%,rgba(200,168,75,.30),transparent 55%)}
  .msadm .hcard.ing::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
  .msadm .hcard.pend{border:1px solid #F4D7DA;border-left:1px solid #F4D7DA;box-shadow:0 14px 34px rgba(239,65,80,.12)}
  .msadm .hcard.pend::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--red),#F9A0A8,transparent)}
  .msadm .hval{font-size:54px;font-weight:700;letter-spacing:.5px;position:relative}
  .msadm .hcard .hlab{letter-spacing:2.6px;font-size:11px;position:relative}
  .msadm .hcard.ing .hlab{color:var(--gold-soft)}
  .msadm .hcard .hsub{position:relative;letter-spacing:.3px}
  .msadm .dls{font-family:'Inter','Segoe UI',system-ui,sans-serif;font-weight:800;font-size:.60em;vertical-align:9%;margin-right:3px;opacity:.92;letter-spacing:0}
  /* --- kpis --- */
  .msadm .kpi{border-radius:14px}
  .msadm .kpi .val{font-size:27px;letter-spacing:.3px}
  .msadm .kpi .lab{letter-spacing:1.6px;font-size:10.5px}
  /* --- botones --- */
  .msadm .btn{border-radius:11px}
  .msadm .btn.pri{background:linear-gradient(135deg,#F25865,var(--red));border:none;box-shadow:0 6px 16px rgba(239,65,80,.30)}
  .msadm .btn.pri:hover{background:linear-gradient(135deg,var(--red),#D9333F);box-shadow:0 8px 20px rgba(239,65,80,.42)}
  .msadm .btn.navy{background:linear-gradient(135deg,#0B4076,var(--navy));border:none;box-shadow:0 6px 16px rgba(4,45,90,.28)}
  /* --- tablas --- */
  .msadm th{letter-spacing:1.5px;background:linear-gradient(180deg,#F8FAFD,#F4F7FB)}
  .msadm tbody tr:hover{background:#F5F8FD}
  /* --- pantalla de PIN --- */
  .msadm .lock{background:radial-gradient(circle at 28% 18%,#0B4076 0%,var(--navy) 46%,var(--navy-deep) 100%)}
  .msadm .lock .caja{border-radius:22px;padding:46px 48px;box-shadow:0 34px 100px rgba(0,0,0,.55);border-top:4px solid var(--gold);max-width:390px}
  .msadm .lock-logo{width:150px;padding:18px;background:var(--navy);border-radius:50%;box-shadow:0 0 0 5px rgba(200,168,75,.25),0 16px 36px rgba(4,45,90,.35);margin-bottom:18px}
  .msadm .lock-txt{display:none}
  .msadm .lock p{letter-spacing:2px;text-transform:uppercase;font-size:10.5px;color:#8A7226;font-weight:700}
  @media(max-width:820px){
    .msadm .brand-logo{width:46px;padding:0}

/* ---------- Fusión de datos (nunca se pierde lo capturado en otro lado) ---------- */
function mergeArr(la,ca){
  const m=new Map();
  (ca||[]).forEach(x=>{if(x&&x.id!=null)m.set(x.id,x);});
  (la||[]).forEach(x=>{
    if(!x||x.id==null)return;
    const c=m.get(x.id);
    if(!c){m.set(x.id,x);return;}
    const r=Object.assign({},x,c);
    if(x.anulado&&!c.anulado)r.anulado=x.anulado;
    if(x.estado==='Baja'&&c.estado!=='Baja')r.estado='Baja';
    ['w','p','b'].forEach(fk=>{if(x[fk]||c[fk])r[fk]=true;});
    if(x.bit||c.bit){const seen={};r.bit=[].concat(c.bit||[],x.bit||[]).filter(bb=>{const k=(bb.f||'')+'|'+(bb.txt||'');if(seen[k])return false;seen[k]=1;return true;});}
    if(x.rep&&!c.rep)r.rep=x.rep;
    m.set(x.id,r);
  });
  return [...m.values()];
}
function mergeDb(l,c){
  if(!c)return l; if(!l)return c;
  const r={};
  ['cursos','alumnos','insc','pagos','egresos'].forEach(k=>r[k]=mergeArr(l[k],c[k]));
  const seenL={};
  r.log=[].concat(c.log||[],l.log||[]).filter(x=>{const k=(x.f||'')+'|'+(x.txt||'');if(seenL[k])return false;seenL[k]=1;return true;}).sort((a,b)=>a.f<b.f?1:-1).slice(0,200);
  r.gImp=[...new Set([].concat(l.gImp||[],c.gImp||[]))];
  r.formsMap=Object.assign({},l.formsMap||{},c.formsMap||{});
  r.formsComp=Object.assign({},l.formsComp||{},c.formsComp||{});
  r.cfg=Object.assign({},l.cfg||{},c.cfg||{});
  r.seq=Math.max(l.seq||1,c.seq||1);
  r.rev=Math.max(l.rev||0,c.rev||0);
  r.lastSync=l.lastSync; r.autoSync=l.autoSync;
  return r;
}

async function pullCloud(silent){
  if(!srv.url)return false;

    const r=await fetch(srv.url+(srv.url.indexOf('?')>=0?'&':'?')+'token='+encodeURIComponent(srv.key)+'&action=get');

    cloudOK=true;

/* ================= SINCRONIZAR GASTOS (Google Sheet) ================= */
async function syncGastos(){
  if(!srv.url||!srv.key){toast('Configure primero la nube (URL y clave) en Respaldo.','err');claveRapida();return;}
  toast('Leyendo su hoja de gastos…');
  try{
    const r=await fetch(srv.url+(srv.url.indexOf('?')>=0?'&':'?')+'token='+encodeURIComponent(srv.key)+'&action=gastos');
    const j=await r.json();
    if(!j.ok){
      if(j.ping)toast('Su servidor tiene la versión anterior del .gs (sin lector de gastos). Pegue el .gs actualizado y publique «Nueva versión».','err');
      else toast('El servidor respondió: '+(j.err||'error'),'err');
      return;
    }
    db.gImp=db.gImp||[];
    const limpiaMonto=s=>+String(s).replace(/[^0-9.\-]/g,'')||0;
    const fFecha=s=>{s=String(s||'').trim();if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);const m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);if(m){let y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');}return hoy();};
    const nuevos=(j.rows||[]).map(x=>({sig:'g'+x.n+'|'+(x.t||x.f)+'|'+x.m+'|'+String(x.c).slice(0,25),x})).filter(o=>db.gImp.indexOf(o.sig)<0&&limpiaMonto(o.x.m)>0);
    if(!nuevos.length){toast('Gastos al día ✓ No hay filas nuevas en la hoja.');return;}
    const tot=nuevos.reduce((s,o)=>s+limpiaMonto(o.x.m),0);
    if(!confirm('Se encontraron '+nuevos.length+' gastos nuevos en la hoja por un total de '+money(tot)+'.\n\n¿Importarlos a Egresos?'))return;
    nuevos.forEach(o=>{
      const x=o.x;
      db.egresos.push({id:uid(),fecha:fFecha(x.f||x.t),categoria:(x.cat||'Otro').trim()||'Otro',beneficiario:(x.b||'—').trim(),concepto:(x.c||'').trim(),monto:limpiaMonto(x.m),metodo:(x.me||'').trim()||'Otro',nota:'Vía Google Sheets'+(x.r?' · registró '+x.r.trim():'')});
      db.gImp.push(o.sig);
    });
    logA('Importó '+nuevos.length+' gastos ('+money(tot)+') desde la hoja de gastos');
    save();render();toast(nuevos.length+' gastos importados a Egresos ✓ Total: '+money(tot));
  }catch(e){toast('No pude conectar con su servidor de nube.','err');}
}

let finMes=hoy().slice(0,7);
function setFinMes(v){finMes=v;render();}
function finMesLbl(m){const pr=m.split('-');return MESES[+pr[1]-1]+' '+pr[0];}
function finMesesOpts(){const out=[];const nw=new Date();for(let k=0;k<8;k++){const d=new Date(nw.getFullYear(),nw.getMonth()-k,15);out.push(d.toISOString().slice(0,7));}return out;}
function finDataMes(){
  const rows=db.pagos.filter(p=>!p.anulado&&p.fecha&&p.fecha.slice(0,7)===finMes).map(repartoPago).filter(Boolean);
  const def=rows.filter(r=>r.def), sinDef=rows.filter(r=>!r.def);
  const ayaxTot=def.reduce((s,r)=>s+r.ayax,0), nosTot=def.reduce((s,r)=>s+r.nos,0);
  const cashAyax=def.filter(r=>r.aAyax).reduce((s,r)=>s+r.monto,0);
  const cashNos=def.reduce((s,r)=>s+r.monto,0)-cashAyax;
  return{rows,def,sinDef,ayaxTot,nosTot,cashAyax,cashNos,transfer:cashAyax-ayaxTot};
}
function vFinanzas(){

function finEditRep(iid){
  const i=insc(iid);if(!i)return;
  const a=alumno(i.alumnoId),c=curso(i.cursoId);
  openModal('🤝 Reparto con el Dr. Ayax · '+esc(a?nombreA(a):'?'),
    '<div class="fld full"><div class="tsub" style="white-space:normal">'+esc(c?c.nombre:'?')+' · Meta <b>'+money(i.meta)+'</b>. Indique cuánto de esa meta corresponde al Dr. Ayax y el % que él nos entrega de su parte. Este reparto puede cambiar durante el semestre: aquí lo ajusta cuando lo necesite.</div></div>'+
    F.num('bruto','Parte del Dr. Ayax de la meta ($)',i.rep?i.rep.bruto:'',1)+
    F.num('pct','% que él nos entrega de su parte',i.rep?i.rep.pct:20,1)+
    '<div class="fld full"><div class="tsub" id="msadmRepPrev" style="white-space:normal"></div></div>',
  fd2=>{
    const bruto=+fd2.get('bruto')||0, pct=+fd2.get('pct')||0;
    if(bruto<=0){toast('La parte del Dr. Ayax debe ser mayor a cero.','err');return;}
    if(bruto>+i.meta){toast('La parte del Dr. Ayax no puede ser mayor que la meta ('+money(i.meta)+').','err');return;}
    i.rep={bruto,pct};
    if(String(i.profesor||'').indexOf('Ayax')<0)i.profesor='Dr. Abdi + Dr. Ayax Rizo';
    logA('Reparto Ayax de '+(a?nombreA(a):'?')+': '+money(bruto)+' de '+money(i.meta)+' al '+pct+'%');
    save();closeModal();render();toast('Reparto guardado ✓');
  },'Guardar reparto');
  setTimeout(()=>{
    const MB=$('#msadmMBody');
    const bI=MB.querySelector('input[name=bruto]'),pI=MB.querySelector('input[name=pct]'),prev=MB.querySelector('#msadmRepPrev');
    const upd=()=>{
      const b=+bI.value||0,pc=+pI.value||0,m=+i.meta||0;
      if(b>0&&m>0){const ayN=Math.round(b*(1-pc/100)),nos=Math.round(m-ayN);
        prev.innerHTML='Sobre la meta completa de '+money(m)+': al Dr. Ayax le quedan <b style="color:#8A7226">'+money(ayN)+'</b> netos y a nosotros <b style="color:var(--ok)">'+money(nos)+'</b> ('+money(m-b)+' + '+pc+'% de su parte). En pagos parciales se aplica proporcional.';
      }else prev.innerHTML='';
    };
    bI.addEventListener('input',upd);pI.addEventListener('input',upd);upd();
  },80);
}
function finRegistrarCorte(){
  const fdt=finDataMes();
  if(!fdt.def.length){toast('No hay pagos compartidos con reparto definido este mes.','err');return;}
  if(db.egresos.find(e=>!e.anulado&&e.mesCorteFin===finMes)){toast('El corte de este mes ya está registrado.','err');return;}
  const dir=fdt.transfer>0?'El Dr. Ayax nos transfiere '+money(fdt.transfer):(fdt.transfer<0?'Le transferimos '+money(-fdt.transfer):'Sin transferencia (cuentas parejas)');
  if(!confirm('Corte de '+finMesLbl(finMes)+':\n\n• Parte del Dr. Ayax (neto): '+money(fdt.ayaxTot)+'\n• Nuestra parte: '+money(fdt.nosTot)+'\n• '+dir+'\n\nSe registrará un egreso por la parte del Dr. Ayax para que el balance quede real. ¿Continuar?'))return;
  db.egresos.push({id:uid(),fecha:hoy(),categoria:'Nómina profesores',beneficiario:'Dr. Ayax Rizo',concepto:'Corte '+finMesLbl(finMes)+' · '+fdt.def.length+' pagos compartidos · '+dir,monto:fdt.ayaxTot,metodo:'Transferencia',mesCorteFin:finMes});

}

function download(name,content,type){const b=new Blob([content],{type});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);}
function expJSON(){download('medstudents-respaldo-'+hoy()+'.json',JSON.stringify(db,null,2),'application/json');toast('Respaldo descargado ✓');}
function csvRow(arr){return arr.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',');}
function expCSV(kind){
  let rows=[];
  if(kind==='alumnos'){rows=[csvRow(['ID','Nombre','Apellido','Email','WhatsApp','Tipo','Grupo WA','Plataforma','Bienvenida'])].concat(db.alumnos.map(a=>csvRow([a.id,a.nombre,a.apellido,a.email,a.whatsapp,a.estatus||'',a.w?'SÍ':'NO',a.p?'SÍ':'NO',a.b?'SÍ':'NO'])));}
  if(kind==='pagos'){rows=[csvRow(['Fecha','Alumno','Curso','Monto','Método','Referencia','Recibió','Nota'])].concat(db.pagos.map(p=>{const i=insc(p.inscId),a=i?alumno(i.alumnoId):null,c=i?curso(i.cursoId):null;return csvRow([p.fecha,a?nombreA(a):'',c?c.nombre:'',p.monto,p.metodo,p.ref,p.recibio,p.nota]);}));}
  if(kind==='egresos'){rows=[csvRow(['Fecha','Categoría','Beneficiario','Concepto','Monto','Método','Nota'])].concat(db.egresos.map(e=>csvRow([e.fecha,e.categoria,e.beneficiario,e.concepto,e.monto,e.metodo,e.nota])));}
  download('medstudents-'+kind+'-'+hoy()+'.csv','\ufeff'+rows.join('\n'),'text/csv');toast('CSV descargado ✓');
}
function impJSON(inp){
  const file=inp.files[0]; if(!file)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.alumnos||!d.cursos)throw 0;db=d;save();render();toast('Respaldo restaurado ✓');}catch(e){toast('Archivo no válido.','err');}};
  r.readAsText(file);
}
function wipe(){if(!confirm('¿Borrar TODOS los datos? Esta acción no se puede deshacer. Descargue un respaldo antes.'))return;db={cursos:[],alumnos:[],insc:[],pagos:[],egresos:[],seq:1};save();render();toast('Datos borrados.');}

function loadXLSX(cb){
  if(window.XLSX)return cb();
  toast('Cargando módulo de Excel…');
  const s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  s.onload=cb;
  s.onerror=()=>toast('No se pudo cargar el módulo de Excel. Revise su conexión a internet.','err');
  document.head.appendChild(s);
}
function expXLSX(){

    try{
      const wb=XLSX.utils.book_new();
      ['ANATOMÍA','HISTOLOGÍA','BIOQUÍMICA','EMBRIOLOGÍA'].forEach(function(m){
        const rows=db.insc.filter(i=>{const c=curso(i.cursoId);return c&&c.materia===m;}).map(i=>({i,a:alumno(i.alumnoId),c:curso(i.cursoId)})).filter(r=>r.a).sort((x,y)=>nombreA(x.a).localeCompare(nombreA(y.a)));
        if(!rows.length)return;

function genListaPDF(mats,act,pag){
  const hoyL=new Date().toLocaleDateString('es-MX',{day:'numeric',month:'long',year:'numeric'});
  let cuerpo='',total=0;
  mats.forEach(function(m){
    const rows=db.insc.filter(i=>{const c=curso(i.cursoId);return c&&c.materia===m&&(!act||i.estado!=='Baja');})
      .map(i=>({i:i,a:alumno(i.alumnoId),c:curso(i.cursoId)})).filter(r=>r.a)
      .sort((x,y)=>nombreA(x.a).localeCompare(nombreA(y.a)));
    if(!rows.length)return;
    total+=rows.length;
    const sumP=rows.reduce((s,r)=>s+pagado(r.i.id),0), sumM=rows.reduce((s,r)=>s+(+r.i.meta||0),0);
    cuerpo+='<section'+(cuerpo?' class="salto"':'')+'>'+
    '<div class="band"><img src="'+logoSrc()+'" alt="" onerror="this.style.display=\'none\'"><div><div class="k">Lista oficial de alumnos</div><h2>'+esc(m)+'</h2><div class="s">'+hoyL+' · '+rows.length+' alumno'+(rows.length===1?'':'s')+(act?' activos':'')+'</div></div></div>'+
    '<table><thead><tr><th>#</th><th>Alumno</th><th>Tipo</th><th>Curso</th><th>Contacto</th><th>W</th><th>P</th><th>B</th>'+(pag?'<th class="n">Pagado</th><th class="n">Meta</th><th>Estado</th>':'')+'</tr></thead><tbody>'+
    rows.map(function(r,k){
      const ep=estPago(r.i);
      return '<tr'+(r.i.estado==='Baja'?' class="baja"':'')+'><td>'+(k+1)+'</td><td class="nm">'+esc(nombreA(r.a))+(r.i.estado==='Baja'?' (BAJA)':'')+'</td>'+
      '<td>'+esc(r.a.estatus||'—')+'</td><td>'+esc(r.c.nombre)+'</td><td>'+esc(r.a.whatsapp||r.a.email||'—')+'</td>'+
      '<td class="c">'+(r.a.w?'✓':'—')+'</td><td class="c">'+(r.a.p?'✓':'—')+'</td><td class="c">'+(r.a.b?'✓':'—')+'</td>'+
      (pag?'<td class="n">'+money(pagado(r.i.id))+'</td><td class="n">'+money(r.i.meta)+'</td><td class="'+(ep[0]==='PAGADO'?'ok':(ep[0]==='SIN PAGOS'?'mal':''))+'">'+ep[0]+'</td>':'')+'</tr>';

function bajaInsc(iid,aid){
  const i=insc(iid);if(!i)return;
  const a=alumno(i.alumnoId),c=curso(i.cursoId);
  if(i.estado==='Baja'){
    if(!confirm('¿Reactivar a '+(a?nombreA(a):'?')+' en '+(c?c.nombre:'?')+'?'))return;
    i.estado='Activa';
    logA('REACTIVÓ a '+(a?nombreA(a):'?')+' en '+(c?c.nombre:'?'));
    save();render();toast('Alumno reactivado ✓');
  }else{
    const r=resto(i);
    const m=prompt('Dar de BAJA a '+(a?nombreA(a):'?')+' en '+(c?c.nombre:'?')+(r>0?' (debe '+money(r)+')':'')+'. Motivo de la baja:','');
    if(m===null)return;
    i.estado='Baja';
    if(m.trim())(i.bit=i.bit||[]).unshift({f:hoy(),txt:'BAJA: '+m.trim()});
    logA('BAJA de '+(a?nombreA(a):'?')+' en '+(c?c.nombre:'?')+(m.trim()?' · Motivo: '+m.trim():'')+(r>0?' · Adeudaba '+money(r):''));
    save();render();toast('Alumno dado de baja del curso. Su historial de pagos se conserva.');
  }
  if(aid)ficha(aid);
}
function bajaAlumno(aid){
  const act=db.insc.filter(i=>i.alumnoId===aid&&i.estado!=='Baja');
  if(!act.length){toast('Este alumno no tiene inscripciones activas.','err');return;}
  if(act.length===1){bajaInsc(act[0].id);return;}
  toast('El alumno está en '+act.length+' cursos. Elija de cuál darlo de baja en su ficha.');
  ficha(aid);
}

  openModal('Inscribir alumno a curso',
    F.sel('alumnoId','Alumno',db.alumnos.slice().sort((a,b)=>nombreA(a).localeCompare(nombreA(b))).map(a=>'<option value="'+a.id+'"'+(a.id===alumnoId?' selected':'')+'>'+esc(nombreA(a))+'</option>').join(''),null,1)+
    F.sel('cursoId','Curso',(cursosOp.length?cursosOp:db.cursos).map(c=>'<option value="'+c.id+'"'+(c.id===cursoId?' selected':'')+' data-mat="'+esc(c.materia)+'">'+esc(c.nombre)+' — '+money(c.precio)+'</option>').join(''),null,1)+

/* ================= ACCESOS GRANULARES (reemplaza W/P/B simple) ================= */
/* 
  wa:   0=pendiente, 1=enviado, 2=confirmado  (grupo WhatsApp)
  plat: 0=pendiente, 1=acceso enviado, 2=confirmado  (plataforma)
  ebook: 0=pendiente, 1=entregado
  taller: 0=pendiente, 1=asignado, 2=asistió
  diag:   0=pendiente, 1=realizado
  factura: 0=no solicitada, 1=pendiente de enviar, 2=enviada
  Retrocompatibilidad: si a.w===true → wa=2, a.p===true → plat=2
*/
function accVal(a, campo, def=0){
  if(campo==='wa'){
    if(typeof a.wa === 'number') return a.wa;
    return a.w ? 2 : 0;
  }
  if(campo==='plat'){
    if(typeof a.plat === 'number') return a.plat;
    return a.p ? 2 : 0;
  }
  return typeof a[campo]==='number' ? a[campo] : def;
}
function accNext(a, campo){
  const maxV={wa:2,plat:2,ebook:1,taller:2,diag:1,factura:2};
  const cur=accVal(a,campo);
  a[campo]=cur>=maxV[campo]?0:cur+1;
  // keep legacy booleans in sync for backward compat
  if(campo==='wa'){a.w=a[campo]>=2;}
  if(campo==='plat'){a.p=a[campo]>=2;}
  if(campo==='wa'&&a[campo]>=2)a.b=true;
  logA('Acceso ['+campo+'] de '+nombreA(a)+' → '+accLabel(campo,a[campo]));
  save();render();
}
function accLabel(campo,v){
  const labels={
    wa:['⬜ WA: Pendiente','🟡 WA: Enviado','🟢 WA: Confirmado'],
    plat:['⬜ Plat: Pendiente','🟡 Plat: Enviado','🟢 Plat: Confirmado'],
    ebook:['⬜ Ebook: Pendiente','🟢 Ebook: Entregado'],
    taller:['⬜ Taller: Pendiente','🟡 Taller: Asignado','🟢 Taller: Asistió'],
    diag:['⬜ Diag: Pendiente','🟢 Diag: Realizado'],
    factura:['','🔴 Factura: Pendiente','🟢 Factura: Enviada'],
  };
  return (labels[campo]||[])[v]||v;
}
function accPill(campo,v,aid){
  const cls={0:'gray',1:'warn',2:'ok'};
  const short={wa:['WA','WA','WA✓'],plat:['Plat','Plat+','Plat✓'],ebook:['📖','📖✓','📖✓'],taller:['Taller','Tall+','Tall✓'],diag:['Dx','Dx✓','Dx✓']};
  const lbl=(short[campo]||['?','?','?'])[Math.min(v,2)];
  return '<button class="pill '+(cls[Math.min(v,2)]||'gray')+'" style="cursor:pointer;border:none;font-size:10px" title="'+accLabel(campo,v)+' — clic para cambiar" onclick="MSADM.accNext('+aid+',\''+campo+'\')">'+lbl+'</button>';
}

function procesarSync(arr,silent){

    const row={nombre:String(r.n||'').trim(),apellido:String(r.a||'').trim(),email:String(r.e||'').trim(),whatsapp:String(r.w||'').trim(),curso:String(r.c||'').trim(),ts:String(r.t||''),estatus:/irregular/i.test(r.s||'')?'Irregular':(/regular/i.test(r.s||'')?'Regular':'')};
    const em=row.email.toLowerCase(),tel=digits(row.whatsapp).slice(-10);
    if(!row.nombre||(!em&&!tel)){row.st='err';row.msg='Fila incompleta';return row;}
    const key=em||tel;if(seen[key]){row.st='dup';row.msg='Repetida en el Forms';return row;}seen[key]=1;
    const ex=db.alumnos.find(a=>(a.email&&em&&a.email.toLowerCase()===em)||(tel&&digits(a.whatsapp).slice(-10)===tel));
    if(ex){row.match=ex.id;const md=mapDef(row.curso);const falta=md.c.filter(cid=>!db.insc.find(i=>i.alumnoId===ex.id&&i.cursoId===cid&&i.estado!=='Baja'));if(md.c.length&&!falta.length){row.st='done';row.msg='Ya inscrito';}else if(row.curso){row.st='ins';row.msg='Ya registrado · se inscribirá';}else{row.st='done';row.msg='Ya registrado';}}else row.st='new';

function parseCSVLine(l){const out=[];let cur='',inQ=false;for(let k=0;k<l.length;k++){const ch=l[k];if(inQ){if(ch==='"'){if(l[k+1]==='"'){cur+='"';k++;}else inQ=false;}else cur+=ch;}else{if(ch==='"')inQ=true;else if(ch===','){out.push(cur);cur='';}else cur+=ch;}}out.push(cur);return out;}
function analizarImport(){
  const box=document.getElementById('impBox');impRaw=box?box.value:impRaw;
  const selC=document.getElementById('impCurso');impCursoSel=selC&&selC.value?+selC.value:null;
  impErr='';impRows=null;
  const lines=impRaw.split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length){impErr='No hay nada que analizar.';render();return;}
  const tab=lines[0].includes('\t');const rows=lines.map(l=>tab?l.split('\t'):parseCSVLine(l));
  const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const h=rows[0].map(norm);
  const find=(...ks)=>h.findIndex(c=>ks.some(k=>c.includes(k)));
  const iN=find('nombre'),iA=find('apellido'),iE=find('correo','email','mail'),iW=find('whats','telefono','celular'),iS=find('soy un alumno','alumno:','regular'),iC=find('selecciona el curso','curso al que');
  if(iN<0||iE<0){impErr='No encontré los encabezados. Copie también la fila 1 de la hoja.';render();return;}
  const arr=rows.slice(1).map(r=>({n:r[iN],a:iA>=0?r[iA]:'',e:r[iE],w:iW>=0?r[iW]:'',s:iS>=0?r[iS]:'',c:iC>=0?r[iC]:'',t:''}));
  procesarSync(arr,false);impRaw='';render();
}

const sbCfg=()=>(db.cfg&&db.cfg.sbUrl&&db.cfg.sbKey)?{url:db.cfg.sbUrl,key:db.cfg.sbKey,clave:(db.cfg.sbClave||'')}:null;
function sbSave(campo,v){
  db.cfg=db.cfg||{};
  if(campo==='url')db.cfg.sbUrl=v.trim();
  if(campo==='key')db.cfg.sbKey=v.trim();
  if(campo==='clave')db.cfg.sbClave=v.trim();
  if(campo==='edge')db.cfg.edgeUrl=v.trim();
  if(campo==='apin')db.cfg.adminPin=v.trim();
  save();toast('Guardado ✓ Presione "Conectar ahora" para activar.');
}

/* ---- Detectar qué cambió entre dos estados ---- */
function sbDiff(oldDb,newDb){
  const changed={};
  const ks=['alumnos','cursos','insc','pagos','egresos'];
  ks.forEach(k=>{
    const on=new Map((oldDb[k]||[]).map(x=>[x.id,JSON.stringify(x)]));
    const nn=new Map((newDb[k]||[]).map(x=>[x.id,JSON.stringify(x)]));
    const news=[],mods=[];
    nn.forEach((v,id)=>{if(!on.has(id))news.push(id);else if(on.get(id)!==v)mods.push(id);});
    if(news.length||mods.length)changed[k]={news,mods};
  });
  return changed;
}

/* ---- Inicializar Supabase ---- */
async function initSupabase(){
  const c=sbCfg();
  if(!c||sbInited||!window.supabase){return;}
  try{
    const{createClient}=window.supabase;
    const sb=createClient(c.url,c.key,{
      realtime:{params:{eventsPerSecond:10}},
      db:{schema:'public'},
      global:{headers:{'x-ms-clave':c.clave||''}}
    });
    sbClient=sb;
    /* Verificar DE VERDAD que la clave llega y es correcta */
    try{
      const{data:dbg,error:dErr}=await sb.rpc('ms_debug_header');
      if(!dErr && dbg && dbg.length){
        if(dbg[0].coincide!==true){
          sbClient=null;sbInited=false;cloudOK=false;updateDot();
          const rec=dbg[0].clave_recibida||'(vacío)';
          toast('🔒 La clave NO coincide. Supabase recibió: "'+rec+'". Corrija la clave en Respaldo → Supabase.','err');
          return;
        }
      }else{
        /* si la función no existe aún, probamos leyendo */
        const{data:t,error:tErr}=await sb.from('ms_state').select('id').eq('id','main');
        if(tErr||!t||!t.length){
          sbClient=null;sbInited=false;cloudOK=false;updateDot();
          toast('🔒 No pude leer de Supabase. Revise la clave de equipo o corra el SQL de diagnóstico.','err');
          return;
        }
      }
    }catch(e){}

    /* ---- Canal de datos (Realtime Postgres Changes) ---- */
    sb.channel('ms-state-ch')
      .on('postgres_changes',{
        event:'*',schema:'public',table:'ms_state',filter:'id=eq.main'
      }, payload=>{
        if(!payload.new||!payload.new.data)return;
        if(payload.new.updated_by===currentUser)return; // ignorar nuestros propios cambios
        const incoming=payload.new.data;
        const rev=payload.new.rev||0;
        if(rev<=(db.rev||0))return; // no retroceder
        const diff=sbDiff(db,incoming);
        db=mergeDb(db,incoming);
        db.rev=rev;
        try{store.set(DB_KEY,JSON.stringify(db));}catch(e){}
        render();
        /* Notificación específica de qué cambió */
        const quien=esc(payload.new.updated_by||'El equipo');
        let cambios=[];
        if(diff.pagos)cambios.push('💰 '+(diff.pagos.news.length)+' pago'+(diff.pagos.news.length!==1?'s':''+' nuevo'));
        if(diff.alumnos)cambios.push('🎓 alumno'+(diff.alumnos.news.length?'s nuevos':'s actualizados'));
        if(diff.insc)cambios.push('📋 inscripciones');
        if(diff.egresos)cambios.push('🧾 egresos');
        toast('📡 '+quien+' actualizó: '+(cambios.join(' · ')||'datos generales'));
      })
      .subscribe();

    /* ---- Canal de locks (pagos en edición) ---- */
    sb.channel('ms-locks-ch')
      .on('postgres_changes',{event:'*',schema:'public',table:'ms_locks'}, payload=>{
        if(payload.eventType==='DELETE'||payload.eventType==='INSERT'||payload.eventType==='UPDATE'){
          refreshLocks();
        }
      })
      .subscribe();

    /* ---- Canal de Presencia ---- */
    sbPresCh=sb.channel('ms-presence',{config:{presence:{key:currentUser}}});
    sbPresCh
      .on('presence',{event:'sync'},()=>{
        presState=sbPresCh.presenceState();
        updatePresUI();
      })
      .on('presence',{event:'join'},({newPresences})=>{
        const u=(newPresences||[])[0];
        if(u&&u.user&&u.user!==currentUser){
          toast('👤 '+esc(u.user)+' se conectó al panel');
        }
        updatePresUI();
      })
      .on('presence',{event:'leave'},({leftPresences})=>{
        const u=(leftPresences||[])[0];
        if(u&&u.user&&u.user!==currentUser){
          toast('👤 '+esc(u.user)+' se desconectó');
          // Liberar locks de quien se fue
          releaseLocks(u.user);
        }
        updatePresUI();
      })
      .subscribe(async status=>{
        if(status==='SUBSCRIBED'){
          await sbPresCh.track({
            user:currentUser,view:view,
            t:Date.now(),online:true
          });
        }
      });
    /* Al cerrar la pestaña, liberar la presencia para no dejar fantasmas */
    window.addEventListener('beforeunload',function(){
      try{if(sbPresCh)sbPresCh.untrack();}catch(e){}
      try{releaseLocks(currentUser);}catch(e){}
    });

    sbInited=true;
    cloudOK=true;dirty=false;
    updateDot();
    toast('✅ Supabase conectado · «'+esc(currentUser)+'» en línea · modo multiusuario activo');

  }catch(e){
    sbClient=null;sbInited=false;
    cloudOK=false;updateDot();
    toast('Supabase: error al conectar — '+String(e&&e.message||e),'err');
  }
}

/* ---- Push a Supabase ---- */
async function sbPush(){
  if(!sbClient)return;
  clearTimeout(sbPushT2);
  sbPushT2=setTimeout(async()=>{
    try{
      db.rev=(db.rev||0)+1;
      const{error}=await sbClient.from('ms_state').upsert({
        id:'main',data:db,rev:db.rev,
        updated_by:currentUser,
        updated_at:new Date().toISOString()
      },{onConflict:'id'});
      if(error)throw error;
      /* Auditoría */
      sbClient.from('ms_activity').insert({
        usuario:currentUser,
        accion:'Guardó cambios (rev '+db.rev+')',
        detalles:db.alumnos.length+' alumnos, '+db.pagos.length+' pagos'
      }).then(()=>{}).catch(()=>{});
      cloudOK=true;dirty=false;
    }catch(e){
      cloudOK=false;
      toast('Supabase: no se guardaron los cambios — '+String(e&&e.message||e),'err');
    }
    updateDot();
  },700);
}

/* ---- Pull de Supabase ---- */
async function sbPull(silent){
  if(!sbClient){toast('Configure Supabase primero en Respaldo.','err');return false;}
  try{
    const{data,error}=await sbClient.from('ms_state')
      .select('id,data,rev,updated_by,updated_at')
      .eq('id','main').single();
    if(error)throw error;
    if(data&&data.data&&(data.rev||0)>(db.rev||0)){
      db=mergeDb(db,data.data);
      db.rev=Math.max(db.rev||0,data.rev||0);
      try{await store.set(DB_KEY,JSON.stringify(db));}catch(e){}
      render();
      if(!silent)toast('Datos actualizados desde Supabase (rev '+db.rev+') ✓');
    }else{
      if(!silent)toast('Supabase al día ✓ Sin cambios nuevos. (rev '+db.rev+')');
    }
    cloudOK=true;updateDot();return true;
  }catch(e){
    cloudOK=false;updateDot();
    if(!silent)toast('Supabase: '+String(e&&e.message||e),'err');
    return false;
  }
}

/* ---- Locks de pagos (edición simultánea) ---- */
async function sbAcquireLock(resourceId){
  if(!sbClient)return true; // sin Supabase = sin locks
  const expiresAt=new Date(Date.now()+120000).toISOString(); // 2 min
  try{
    const{data,error}=await sbClient.from('ms_locks').upsert({
      id:resourceId,usuario:currentUser,expires_at:expiresAt
    },{onConflict:'id',ignoreDuplicates:false}).select().single();
    if(error)throw error;
    // Verify we got it
    const{data:chk}=await sbClient.from('ms_locks').select('usuario').eq('id',resourceId).single();
    if(chk&&chk.usuario!==currentUser){
      toast('⚠️ '+esc(chk.usuario)+' ya está editando este pago. Espera a que termine.','err');
      return false;
    }
    return true;
  }catch(e){return true;} // Si falla el lock, permitir de todas formas
}
async function sbReleaseLock(resourceId){
  if(!sbClient)return;
  try{await sbClient.from('ms_locks').delete().eq('id',resourceId).eq('usuario',currentUser);}catch(e){}
}
async function releaseLocks(usuario){
  if(!sbClient||!usuario)return;
  try{await sbClient.from('ms_locks').delete().eq('usuario',usuario);}catch(e){}
}
async function refreshLocks(){
  if(!sbClient)return;
  try{
    const{data}=await sbClient.from('ms_locks').select('*').gt('expires_at',new Date().toISOString());
    sbLocks={};
    (data||[]).forEach(l=>{sbLocks[l.id]={user:l.usuario,exp:l.expires_at};});
    updatePresUI();
  }catch(e){}
}
setInterval(refreshLocks,30000);
setInterval(function(){if(sbClient&&sbInited&&typeof repCargar==='function')repCargar(true);},20000);

/* ---- Presencia en tiempo real ---- */
function updatePresUI(){
  const el=document.getElementById('msadmPresence');
  if(!el)return;
  const now=Date.now();
  /* Agrupar por persona: una sola línea por usuario, sin importar cuántas pestañas tenga */
  const porUsuario={};
  Object.values(presState).flat().forEach(u=>{
    if(!u||!u.user)return;
    const t=u.t||0;
    if(now-t>120000)return; /* ignorar sesiones muertas (>2 min sin señal) */
    if(!porUsuario[u.user]||t>porUsuario[u.user].t)porUsuario[u.user]={user:u.user,t:t};
  });
  const otros=Object.values(porUsuario).filter(u=>u.user!==currentUser).sort((a,b)=>b.t-a.t);
  if(!sbInited){
    el.innerHTML='<div style="font-size:10px;color:rgba(239,65,80,.8);padding:2px 0">Sin conexión Supabase</div>';
    return;
  }
  if(!otros.length){
    el.innerHTML='<div style="font-size:10px;color:rgba(255,255,255,.4);padding:2px 0"><span class="sb-dot on" style="margin-right:5px"></span>Solo tú en línea</div>';
    return;
  }
  el.innerHTML=
    '<div style="font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(200,168,75,.6);font-weight:800;margin-bottom:5px">Equipo en línea ('+otros.length+')</div>'+
    otros.map(u=>{
      const stale=(now-(u.t||0))>90000;
      const editando=Object.values(sbLocks).find(l=>l.user===u.user);
      return '<div class="sb-user">'+
        '<span class="sb-dot '+(stale?'idle':'on')+'"></span>'+
        '<span style="color:rgba(255,255,255,.75);font-size:10.5px">'+esc(u.user)+'</span>'+
        (editando?'<span style="font-size:9px;color:#EF4150;margin-left:4px">✏️</span>':'')+
      '</div>';
    }).join('');
  // Heartbeat: actualizar presencia cada 60s
  if(!el.__hb)el.__hb=setInterval(()=>{
    if(sbPresCh)sbPresCh.track({user:currentUser,view:view,t:Date.now(),online:true}).catch(()=>{});
    // Limpiar locks propios expirados
    Object.entries(sbLocks).forEach(([id,l])=>{
      if(l.user===currentUser&&new Date(l.exp)<new Date())sbReleaseLock(id);
    });
  },60000);
}

/* ---- SQL para copiar ---- */
function sbCopiarSQL(){
  const sql=`-- MedStudents Admin Panel · Supabase Setup
-- Copiar y pegar en Supabase → SQL Editor → Run

CREATE TABLE IF NOT EXISTS ms_state (
  id TEXT PRIMARY KEY DEFAULT 'main',
  data JSONB NOT NULL DEFAULT '{}',
  rev BIGINT DEFAULT 0,
  updated_by TEXT,
  updated_at TIMESTAMPTZ DEFAULT now()
);

CREATE TABLE IF NOT EXISTS ms_activity (
  id BIGSERIAL PRIMARY KEY,
  usuario TEXT, accion TEXT, detalles TEXT,
  created_at TIMESTAMPTZ DEFAULT now()
);

CREATE TABLE IF NOT EXISTS ms_locks (
  id TEXT PRIMARY KEY,
  usuario TEXT NOT NULL,
  expires_at TIMESTAMPTZ NOT NULL,
  created_at TIMESTAMPTZ DEFAULT now()
);

ALTER PUBLICATION supabase_realtime ADD TABLE ms_state;
ALTER PUBLICATION supabase_realtime ADD TABLE ms_activity;
ALTER TABLE ms_state DISABLE ROW LEVEL SECURITY;
ALTER TABLE ms_activity DISABLE ROW LEVEL SECURITY;
ALTER TABLE ms_locks DISABLE ROW LEVEL SECURITY;

INSERT INTO ms_state (id, data, rev) VALUES ('main', '{}', 0) ON CONFLICT (id) DO NOTHING;`;
  if(navigator.clipboard)navigator.clipboard.writeText(sql).then(()=>toast('SQL copiado al portapapeles ✓'));
  else{const t=document.createElement('textarea');t.value=sql;document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t);toast('SQL copiado ✓');}
}

/* ---- Override save() para usar Supabase ---- */
save=async function(){
  dirty=true;updateDot();
  clearTimeout(saving);
  saving=setTimeout(async()=>{
    try{await store.set(DB_KEY,JSON.stringify(db));}catch(e){toast('Error al guardar localmente.','err');}
    if(sbClient&&sbInited){
      await sbPush();
    } else if(srv&&srv.url){
      pushCloud();
    }
  },250);
};

/* ---- Override pullCloud() para Supabase ---- */
pullCloud=async function(silent){
  if(sbClient&&sbInited)return await sbPull(silent);
  if(!srv||!srv.url){if(!silent)toast('Configure Supabase o la nube de Apps Script primero.','err');return false;}
  // Fallback al pullCloud original (lo referenciaremos diferente)
  try{
    const r=await fetch(srv.url+(srv.url.indexOf('?')>=0?'&':'?')+'token='+encodeURIComponent(srv.key)+'&action=get');
    const j=await r.json();

/* ================= 3) PROYECCIÓN DE CIERRE DE SEMESTRE ================= */
function cardProyCierre(){
  const c=semCfg(),now=new Date();
  const ing=db.pagos.filter(p=>!p.anulado).reduce((s,p)=>s+(+p.monto||0),0);
  const porCobrar=db.insc.filter(i=>i.estado==='Activa').reduce((s,i)=>s+resto(i),0);
  const proyMin=ing+Math.round(porCobrar*0.7), proyMax=ing+porCobrar;
  /* ritmo temporal: usa avance del semestre (con ventana de preventa de 45 días) */
  const pre=45*864e5, t0=c.start.getTime()-pre, t1=c.end.getTime();
  const frac=Math.min(1,Math.max(0.02,(now.getTime()-t0)/(t1-t0)));
  const proyRitmo=now<c.start?null:Math.round(ing/frac);
  const meta=SEM_ANT.total, mx=Math.max(proyMax,meta,1);
  const central=proyRitmo?Math.round((Math.min(proyRitmo,proyMax)+proyMin)/2):Math.round((proyMin+proyMax)/2);
  const dif=central-meta;
  const verd=dif>=0
    ?'🟢 A este ritmo cierras el semestre <b>'+money(dif)+' ARRIBA</b> del anterior ('+money(meta)+').'
    :'🟠 A este ritmo cerrarías <b>'+money(-dif)+' abajo</b> del semestre anterior. Considera empujar intensivos/globales o apretar cobranza.';
  return card('🔮 Proyección de cierre de semestre','',
   '<div class="bd">'+
   '<div style="display:flex;gap:24px;flex-wrap:wrap;margin-bottom:14px">'+
   '<div><div class="tsub">Cobrado hasta hoy</div><div style="font-size:22px;font-weight:800;color:var(--ok)">'+money(ing)+'</div></div>'+
   '<div><div class="tsub">Por cobrar (metas activas)</div><div style="font-size:22px;font-weight:800;color:var(--warn)">'+money(porCobrar)+'</div></div>'+
   '<div><div class="tsub">Cierre estimado</div><div style="font-size:22px;font-weight:800;color:var(--navy)">'+money(proyMin)+' – '+money(proyMax)+'</div></div>'+
   (proyRitmo?'<div><div class="tsub">Ritmo actual proyecta</div><div style="font-size:22px;font-weight:800;color:#8A7226">'+money(proyRitmo)+'</div></div>':'')+
   '</div>'+
   '<div class="tsub" style="margin-bottom:4px">Rango de cierre vs semestre anterior ('+money(meta)+')</div>'+
   '<div class="bar-track" style="height:20px;position:relative">'+
     '<div class="bar-fill" style="width:'+Math.round(proyMin/mx*100)+'%;background:linear-gradient(90deg,var(--navy-soft),var(--navy))"></div>'+
     '<div style="position:absolute;top:-4px;bottom:-4px;left:'+Math.round(meta/mx*100)+'%;width:3px;background:var(--gold);border-radius:2px" title="Semestre anterior '+money(meta)+'"></div>'+
   '</div>'+
   '<div class="legend" style="margin-top:6px"><span><i style="background:var(--navy)"></i>Proyección mínima (70% de cobro)</span><span><i style="background:var(--gold)"></i>Marca: semestre anterior</span></div>'+
   '<div style="margin-top:12px;font-size:13.5px;font-weight:700;color:var(--ink)">'+verd+'</div>'+
   '<div class="tsub" style="margin-top:6px;white-space:normal">El rango asume que cobras entre el 70% y el 100% de las metas activas. El "ritmo actual" extrapola lo cobrado según el avance del semestre (incluye 45 días de preventa). Se afina solo conforme registres pagos.</div>'+
   '</div>');
}

let repPend=[], repRealtime=false;

/* ---- Cargar reportes desde Supabase ---- */
async function repCargar(silent){
  if(!sbClient||!sbInited){if(!silent)toast('Conecte Supabase primero (Respaldo → Supabase).','err');return;}
  try{
    const{data,error}=await sbClient.from('ms_pagos_reportados')
      .select('*').order('created_at',{ascending:false}).limit(200);
    if(error)throw error;
    repPend=data||[];
    if(!repRealtime){
      sbClient.channel('ms-reportes-ch')
        .on('postgres_changes',{event:'*',schema:'public',table:'ms_pagos_reportados'},payload=>{
          repCargar(true);
          if(payload.eventType==='INSERT'&&payload.new){
            const r=payload.new;
            toast('🔔 Nuevo pago reportado: '+esc(r.nombre)+' · '+money(r.monto));
            repBadge();
          }
        })
        .subscribe();
      repRealtime=true;
    }
    repBadge();
    if(view==='validar')render();
  }catch(e){if(!silent)toast('Error leyendo reportes: '+String(e&&e.message||e),'err');}
}

    const opts=db.insc.slice().sort((x,y)=>y.id-x.id).map(ii=>{const al=alumno(ii.alumnoId),c=curso(ii.cursoId),rr=resto(ii);return '<option value="'+ii.id+'">'+esc(nombreA(al))+' — '+esc(c?c.nombre:'?')+(rr>0?' (debe '+money(rr)+')':'')+'</option>';}).join('');

      '<div class="fld full"><div style="background:#F7F9FC;border-radius:10px;padding:12px;margin-bottom:6px"><b style="color:var(--navy)">'+esc(r.nombre)+'</b> reportó <b style="color:var(--ok)">'+money(r.monto)+'</b><div class="tsub">'+esc(r.curso||'')+' · '+esc(r.referencia||'sin ref')+' · '+esc(r.whatsapp||r.email||'')+'</div>'+(r.comprobante?'<a class="wa" href="'+esc(r.comprobante)+'" target="_blank" style="display:inline-block;margin-top:6px">🖼 Ver comprobante</a>':'')+'</div>'+
      '<div class="tsub" style="margin:8px 0;white-space:normal">Este alumno no está vinculado automáticamente. Elige a qué inscripción aplicar el pago:</div></div>'+
      F.sel('inscId','Aplicar a la inscripción de:',opts,null,1)+
      F.sel('recibio','¿Quién recibió?',opt(['Dr. Abdi','Dr. Ayax','Oficina'],'Dr. Abdi')),
    fd=>{
      const ii=insc(+fd.get('inscId'));if(!ii){toast('Selecciona una inscripción.','err');return;}
      _repConfirmar(r,ii,fd.get('recibio'));
      closeModal();
    },'Aprobar y registrar pago');
    return;
  }
  _repConfirmar(r,i,recibioAyax({recibio:r.nota})?'Dr. Ayax':'Dr. Abdi');
}

    banco:bancoR,folio:(r.folio||'').trim(),

  logA('✓ Validó pago reportado de '+(a?nombreA(a):r.nombre)+' ('+money(r.monto)+') vía portal');
  save();

  try{
    await sbClient.from('ms_pagos_reportados').update({estado:'aprobado',revisado_por:currentUser,updated_at:new Date().toISOString()}).eq('id',r.id);

   ====================================================================== */

/* ---- Normalizar referencia para comparar (quita espacios, guiones, ceros a la izquierda) ---- */
function normRef(s){
  return String(s||'').toLowerCase().replace(/[\s\-\/#.]/g,'').replace(/^0+/,'').trim();
}
/* ---- Buscar pagos que coincidan con una referencia/monto/fecha dados ---- */
function detectarDuplicado({ref,monto,fecha,excluirPagoId,excluirRepId}){
  const nRef=normRef(ref);
  const m=Math.round(+monto||0);
  const hits=[];
  /* 1) Contra pagos ya registrados en el panel */
  db.pagos.forEach(p=>{
    if(p.anulado)return;
    if(excluirPagoId&&p.id===excluirPagoId)return;
    const pRef=normRef(p.ref);
    let score=0, motivos=[];
    if(nRef&&pRef&&nRef===pRef){score+=3;motivos.push('misma referencia');}
    if(m>0&&Math.round(+p.monto||0)===m){score+=1;motivos.push('mismo monto');}
    if(fecha&&p.fecha&&fecha===p.fecha){score+=1;motivos.push('misma fecha');}
    /* referencia idéntica = alerta fuerte; monto+fecha iguales sin ref = alerta media */
    if(score>=3||(score>=2&&nRef&&pRef&&nRef===pRef)||(!nRef&&m>0&&fecha&&score>=2)){
      const i=insc(p.inscId),a=i?alumno(i.alumnoId):null,c=i?curso(i.cursoId):null;
      hits.push({tipo:'pago',score,motivos,ref:p.ref,monto:p.monto,fecha:p.fecha,
        quien:a?nombreA(a):'(alumno)',curso:c?c.nombre:'',pagoId:p.id,recibio:p.recibio});
    }
  });
  /* 2) Contra reportes del portal aún pendientes/aprobados */
  (repPend||[]).forEach(r=>{
    if(excluirRepId&&r.id===excluirRepId)return;
    if(r.estado==='rechazado')return;
    const rRef=normRef(r.referencia);
    let score=0, motivos=[];
    if(nRef&&rRef&&nRef===rRef){score+=3;motivos.push('misma referencia');}
    if(m>0&&Math.round(+r.monto||0)===m){score+=1;motivos.push('mismo monto');}
    if(fecha&&r.fecha_pago&&fecha===r.fecha_pago){score+=1;motivos.push('misma fecha');}
    if(score>=3||(!nRef&&m>0&&fecha&&score>=2)){
      hits.push({tipo:'reporte',score,motivos,ref:r.referencia,monto:r.monto,fecha:r.fecha_pago,
        quien:r.nombre,curso:r.curso||'',estado:r.estado});
    }
  });
  return hits.sort((a,b)=>b.score-a.score);
}
/* ---- Modal de alerta de duplicado ---- */
function alertaDuplicado(hits,datos,onContinuar){
  const fuerte=hits.some(h=>h.motivos.includes('misma referencia'));
  const html=
    '<div class="fld full">'+
    '<div style="background:'+(fuerte?'#FDE7E9':'#FBF0DA')+';border:1.5px solid '+(fuerte?'#F9A0A8':'#E5D5A3')+';border-radius:12px;padding:14px;margin-bottom:14px">'+
    '<div style="font-size:15px;font-weight:800;color:'+(fuerte?'var(--red)':'#8A6D1B')+';margin-bottom:6px">'+(fuerte?'🚨 ¡ALERTA! Comprobante posiblemente duplicado':'⚠️ Posible pago repetido')+'</div>'+
    '<div class="tsub" style="white-space:normal;color:'+(fuerte?'#8A2A32':'#8A6D1B')+'">'+(fuerte
      ?'La referencia bancaria <b>'+esc(datos.ref||'(vacía)')+'</b> ya fue usada. Un alumno podría estar reportando el MISMO comprobante dos veces. Revísalo antes de continuar.'
      :'Existe otro pago con el mismo monto y fecha. Verifica que no sea el mismo comprobante contado dos veces.')+'</div></div>'+
    '<div class="tsub" style="font-weight:800;color:var(--navy);margin-bottom:8px">Coincidencias encontradas ('+hits.length+'):</div>'+
    '<div style="max-height:260px;overflow-y:auto">'+
    hits.map(h=>{
      const badge=h.motivos.includes('misma referencia')?'<span class="pill bad">MISMA REFERENCIA</span>':'<span class="pill warn">'+esc(h.motivos.join(' + '))+'</span>';
      return '<div style="border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:8px">'+

const MATS4=['ANATOMÍA','HISTOLOGÍA','EMBRIOLOGÍA','BIOQUÍMICA'];
function tarifas(){

function tarSet(campo,valor,extra){
  db.cfg=db.cfg||{};db.cfg.tarifas=db.cfg.tarifas||{};
  const t=tarifas();
  if(campo==='mat'){t.mat[extra]=Math.max(0,+valor||0);db.cfg.tarifas.mat=t.mat;}
  if(campo==='combo'){const c=t.combos[extra];if(c)c.p=Math.max(0,+valor||0);db.cfg.tarifas.combos=t.combos;}
  if(campo==='comboMats'){const c=t.combos[extra];if(c)c.m=valor;db.cfg.tarifas.combos=t.combos;}
  save();render();toast('Tarifa actualizada ✓');
}
function tarAddCombo(){

function tarComboMat(ix,mat,check){

/* Sincroniza el precio de lista de cada curso con su tarifa (proactivo) */
function tarSyncCursos(){
  const t=tarifas();let n=0;
  db.cursos.forEach(c=>{
    const p=t.mat[c.materia];
    if(p>0&&(+c.precio||0)!==p){c.precio=p;n++;}
  });

/* ---- Calcula la meta que le toca a cada inscripción de un alumno ---- */
function metasDeAlumno(aid){
  const t=tarifas();
  const ins=db.insc.filter(i=>i.alumnoId===aid&&i.estado==='Activa');
  if(!ins.length)return null;
  const mats=ins.map(i=>{const c=curso(i.cursoId);return c?c.materia:null;}).filter(Boolean);
  const setA=[...new Set(mats)].sort().join('|');
  const combo=t.combos.find(cb=>cb.m&&cb.m.length&&[...new Set(cb.m)].sort().join('|')===setA&&+cb.p>0);
  const out={};
  if(combo){
    /* reparte el precio del combo proporcional al precio individual */
    const tot=ins.reduce((s,i)=>{const c=curso(i.cursoId);return s+(c?(+t.mat[c.materia]||0):0);},0);
    let acc=0;
    ins.forEach((i,k)=>{
      const c=curso(i.cursoId);const base=c?(+t.mat[c.materia]||0):0;
      const v=(k===ins.length-1)?(+combo.p-acc):Math.round(+combo.p*(tot?base/tot:1/ins.length));
      acc+=v;out[i.id]=v;
    });
    return {tipo:combo.n,total:+combo.p,metas:out,ins};
  }
  ins.forEach(i=>{const c=curso(i.cursoId);out[i.id]=c?(+t.mat[c.materia]||0):0;});
  return {tipo:'Individual',total:Object.values(out).reduce((s,v)=>s+v,0),metas:out,ins};
}

function tarAplicarAlumno(aid){
  const r=metasDeAlumno(aid);
  if(!r){toast('Este alumno no tiene inscripciones activas.','err');return;}
  const a=alumno(aid);
  const lineas=r.ins.map(i=>{const c=curso(i.cursoId);return '• '+(c?c.nombre:'?')+': '+money(i.meta)+' → '+money(r.metas[i.id]);}).join('\n');
  if(!confirm('Aplicar tarifa a '+nombreA(a)+'\n\nTipo detectado: '+r.tipo+' ('+money(r.total)+')\n\n'+lineas+'\n\n¿Continuar?'))return;
  r.ins.forEach(i=>{if(i.estado!=='Becada')i.meta=r.metas[i.id];});
  logA('Aplicó tarifa «'+r.tipo+'» a '+nombreA(a)+' ('+money(r.total)+')');
  save();render();ficha(aid);
  toast('Tarifa aplicada ✓ '+r.tipo+' · '+money(r.total));
}

   (alerta.length?'<div style="background:#FDE7E9;border:1px solid #F9A0A8;border-radius:10px;padding:11px;margin-bottom:12px;font-size:12.5px;color:#8A2A32"><b>⚠️ Atención:</b> '+alerta.length+' alumno(s) ya pagaron MÁS de la meta nueva. Revíselos: puede que tengan un precio especial. Se marcan en rojo abajo.</div>':'')+

   cambios.map(x=>'<tr'+(x.pg>x.nueva?' style="background:#FDF4F5"':'')+'><td class="tname">'+esc(x.a?nombreA(x.a):'?')+'</td><td class="tsub">'+esc(x.c?x.c.nombre:'?')+'</td><td><span class="pill '+(x.tipo==='Individual'?'gray':'gold')+'">'+esc(x.tipo.replace('Combo ',''))+'</span></td><td class="num tsub">'+money(x.actual)+'</td><td class="num"><b style="color:var(--ok)">'+money(x.nueva)+'</b></td></tr>').join('')+
   '</tbody></table></div></div>';
  openModal('💲 Aplicar tarifas a todos los alumnos',html,()=>{

/* ======================================================================
   MÓDULO v11: DETECTOR Y FUSIÓN DE ALUMNOS DUPLICADOS
   ====================================================================== */
function normNom(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
}
function dupKeyEmail(a){return String(a.email||'').toLowerCase().trim();}
function dupKeyTel(a){const d=String(a.whatsapp||'').replace(/\D/g,'');return d.length>=10?d.slice(-10):'';}
function dupKeyNom(a){return normNom(nombreA(a));}

/* Agrupa alumnos que son la misma persona */
function detectarDupsAlumnos(){
  const grupos=[];const usados=new Set();
  const A=db.alumnos.slice();
  A.forEach((a,ix)=>{
    if(usados.has(a.id))return;
    const em=dupKeyEmail(a),tel=dupKeyTel(a),nom=dupKeyNom(a);
    const g=[a];
    A.forEach((b,jx)=>{
      if(jx<=ix||usados.has(b.id))return;
      const em2=dupKeyEmail(b),tel2=dupKeyTel(b),nom2=dupKeyNom(b);
      let motivo='';
      if(em&&em2&&em===em2)motivo='mismo email';
      else if(tel&&tel2&&tel===tel2)motivo='mismo WhatsApp';
      else if(nom&&nom2&&nom===nom2)motivo='mismo nombre';
      if(motivo){g.push(b);b.__motivo=motivo;usados.add(b.id);}
    });
    if(g.length>1){usados.add(a.id);grupos.push(g);}
  });
  return grupos;
}
/* Fusiona: mueve inscripciones y pagos al alumno que se conserva */
function fusionarAlumnos(keepId,dropIds){
  const keep=alumno(keepId);if(!keep)return;
  let movInsc=0,movPagos=0,borrados=0,fusionInsc=0;
  dropIds.forEach(did=>{
    const d=alumno(did);if(!d||did===keepId)return;
    /* completar datos faltantes en el que se conserva */
    ['email','whatsapp','estatus','nota'].forEach(f=>{if(!keep[f]&&d[f])keep[f]=d[f];});
    ['w','p','b'].forEach(f=>{if(d[f])keep[f]=true;});
    ['wa','plat','ebook','taller','diag','factura'].forEach(f=>{
      if(typeof d[f]==='number'&&(typeof keep[f]!=='number'||d[f]>keep[f]))keep[f]=d[f];
    });
    /* mover inscripciones */
    db.insc.filter(i=>i.alumnoId===did).forEach(i=>{
      const ya=db.insc.find(x=>x.alumnoId===keepId&&x.cursoId===i.cursoId&&x.id!==i.id&&x.estado!=='Baja');
      if(ya){
        /* mismo curso duplicado: pasar los pagos a la inscripción que se conserva */
        db.pagos.filter(p=>p.inscId===i.id).forEach(p=>{p.inscId=ya.id;movPagos++;});
        if((+i.meta||0)>(+ya.meta||0))ya.meta=i.meta;
        if(i.rep&&!ya.rep)ya.rep=i.rep;
        if(i.bit&&i.bit.length)ya.bit=[].concat(ya.bit||[],i.bit);
        db.insc=db.insc.filter(x=>x.id!==i.id);
        fusionInsc++;
      }else{
        i.alumnoId=keepId;movInsc++;
      }
    });
    db.alumnos=db.alumnos.filter(a=>a.id!==did);
    borrados++;
  });

/* ---------- 1) FUSIÓN POR IDENTIDAD ---------- */
function idKeyAlumno(a){
  const em=String(a.email||'').toLowerCase().trim();
  if(em)return 'e:'+em;
  const tel=String(a.whatsapp||'').replace(/\D/g,'');
  if(tel.length>=10)return 't:'+tel.slice(-10);
  const n=String((a.nombre||'')+' '+(a.apellido||'')).toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
  return n?('n:'+n):('id:'+a.id);
}
/* Sobrescribe mergeDb: después de fusionar por ID, colapsa alumnos que son
   la MISMA persona aunque tengan IDs distintos, y remapea sus inscripciones. */
const _v12OrigMergeDb=mergeDb;
mergeDb=function(l,c){
  const r=_v12OrigMergeDb(l,c);
  if(!r||!r.alumnos||!r.alumnos.length)return r;
  const porIdentidad={}, remap={};
  const ordenados=r.alumnos.slice().sort((a,b)=>(a.id||0)-(b.id||0)); /* el más viejo manda */
  ordenados.forEach(a=>{
    const k=idKeyAlumno(a);
    if(!porIdentidad[k]){porIdentidad[k]=a;return;}
    const keep=porIdentidad[k];
    /* completar campos vacíos del que se conserva */
    ['email','whatsapp','estatus','nota','alta'].forEach(f=>{if(!keep[f]&&a[f])keep[f]=a[f];});
    ['w','p','b'].forEach(f=>{if(a[f])keep[f]=true;});
    ['wa','plat','ebook','taller','diag','factura'].forEach(f=>{
      if(typeof a[f]==='number'&&(typeof keep[f]!=='number'||a[f]>keep[f]))keep[f]=a[f];
    });
    remap[a.id]=keep.id;
  });
  const nDup=Object.keys(remap).length;
  if(!nDup)return r;
  r.alumnos=Object.values(porIdentidad);
  /* remapear inscripciones al alumno conservado */
  (r.insc||[]).forEach(i=>{if(remap[i.alumnoId])i.alumnoId=remap[i.alumnoId];});
  /* colapsar inscripciones repetidas (mismo alumno + mismo curso) */
  const vistas={}, muertas={};
  (r.insc||[]).slice().sort((a,b)=>(a.id||0)-(b.id||0)).forEach(i=>{
    if(i.estado==='Baja')return;
    const k=i.alumnoId+'|'+i.cursoId;
    if(!vistas[k]){vistas[k]=i;return;}
    const keep=vistas[k];
    if((+i.meta||0)>(+keep.meta||0))keep.meta=i.meta;
    if(i.rep&&!keep.rep)keep.rep=i.rep;
    if(i.numPagos&&!keep.numPagos)keep.numPagos=i.numPagos;
    if(i.bit&&i.bit.length)keep.bit=[].concat(keep.bit||[],i.bit);
    muertas[i.id]=keep.id;
  });
  const nInsc=Object.keys(muertas).length;
  if(nInsc){
    (r.pagos||[]).forEach(p=>{if(muertas[p.inscId])p.inscId=muertas[p.inscId];});
    r.insc=(r.insc||[]).filter(i=>!muertas[i.id]);
  }
  /* quitar pagos idénticos duplicados (mismo insc, fecha, monto y ref) */
  const pk={}, antes=(r.pagos||[]).length;
  r.pagos=(r.pagos||[]).filter(p=>{
    const k=p.inscId+'|'+(p.fecha||'')+'|'+Math.round(+p.monto||0)+'|'+String(p.ref||'').toLowerCase().trim();
    if(pk[k])return false; pk[k]=1; return true;
  });
  const nPag=antes-r.pagos.length;
  r.log=r.log||[];
  r.log.unshift({f:new Date().toISOString().slice(0,16).replace('T',' '),
    txt:'🔗 Auto-fusión al sincronizar: '+nDup+' alumno(s) duplicado(s)'+(nInsc?', '+nInsc+' inscripción(es)':'')+(nPag?', '+nPag+' pago(s) repetido(s)':'')});
  try{setTimeout(()=>toast('🔗 Se fusionaron automáticamente '+nDup+' alumno(s) duplicado(s) al sincronizar.'),1200);}catch(e){}
  return r;
};

function comprimirImg(file, maxW=1400, calidad=0.82){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        res({dataUrl:cv.toDataURL('image/jpeg',calidad)});
      };
      img.onerror=rej;img.src=e.target.result;
    };
    r.onerror=rej;r.readAsDataURL(file);
  });
}
async function leerComprobante(dataUrl){
  const base=dataUrl.split(',')[1];
  const prompt='Esta es la imagen de un comprobante de transferencia bancaria mexicano. '+
    'Extrae los datos y responde SOLO con un objeto JSON válido, sin markdown ni texto extra, con estas claves exactas: '+
    '{"monto": número sin símbolos (ej 2400), "ref":"número de referencia o folio", "fecha":"AAAA-MM-DD", '+
    '"banco":"banco origen", "ordenante":"nombre completo de quien ENVÍA el dinero (cuenta origen)", '+
    '"concepto":"concepto si hay", "claveRastreo":"clave de rastreo si aparece"}. '+
    'Si un dato no aparece, pon cadena vacía (o 0 para monto). Convierte la fecha a AAAA-MM-DD. '+
    'El ordenante es quien PAGA, no el destinatario.';
  const resp=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:600,messages:[
      {role:'user',content:[
        {type:'image',source:{type:'base64',media_type:'image/jpeg',data:base}},
        {type:'text',text:prompt}
      ]}
    ]})
  });
  const data=await resp.json();
  const txt=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
  const clean=txt.replace(/```json|```/g,'').trim();
  const a=clean.indexOf('{'),z=clean.lastIndexOf('}');
  if(a<0||z<0)throw new Error('No pude leer el comprobante');
  return JSON.parse(clean.slice(a,z+1));
}
async function subirComprobante(dataUrl){
  if(!sbClient||!sbInited)return '';
  try{
    const base=dataUrl.split(',')[1];
    const bin=atob(base);const arr=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    const blob=new Blob([arr],{type:'image/jpeg'});
    const path='pago_'+Date.now()+'_'+Math.floor(Math.random()*9999)+'.jpg';
    const{error}=await sbClient.storage.from('comprobantes').upload(path,blob,{contentType:'image/jpeg',upsert:false});
    if(error)throw error;
    const{data}=sbClient.storage.from('comprobantes').getPublicUrl(path);
    return data.publicUrl;
  }catch(e){toast('No pude subir la imagen: '+String(e&&e.message||e),'err');return '';}
}

/* ---- Hash simple de imagen para detectar comprobantes idénticos (misma foto) ---- */
function hashImg(dataUrl){
  let h=0;const s=dataUrl.length>5000?dataUrl.slice(0,5000):dataUrl;
  for(let i=0;i<s.length;i++){h=((h<<5)-h+s.charCodeAt(i))|0;}
  return String(h);
}

/* ---- Detectar comprobante repetido: por referencia O por imagen idéntica ---- */
function comprobanteRepetido(ref,imgHash,exceptPagoId){
  const hits=[];
  db.pagos.forEach(p=>{
    if(p.anulado||p.id===exceptPagoId)return;
    if(ref&&p.ref&&String(p.ref).toLowerCase().trim()===String(ref).toLowerCase().trim())hits.push({p,motivo:'misma referencia'});
    else if(imgHash&&p.compHash&&p.compHash===imgHash)hits.push({p,motivo:'misma imagen'});
  });
  return hits;
}

/* ======================================================================
   MODELO UNIFICADO: UNA ficha por alumno con 1..N materias y UNA deuda total
   - i.mats = ['ANATOMÍA','HISTOLOGÍA', ...]
   - i.meta = total calculado (con precio de combo cuando aplica)
   - i.cursoId = curso de la primera materia (compatibilidad con listas/dashboard)
   ====================================================================== */

const PRECIO_MAT={'ANATOMÍA':3800,'HISTOLOGÍA':3000,'EMBRIOLOGÍA':3600,'BIOQUÍMICA':3600};
const COMBOS=[
  {id:'AH',mats:['ANATOMÍA','HISTOLOGÍA'],precio:6000},
  {id:'EB',mats:['EMBRIOLOGÍA','BIOQUÍMICA'],precio:6200}
];
const MATS_ORDEN=['ANATOMÍA','HISTOLOGÍA','EMBRIOLOGÍA','BIOQUÍMICA'];

/* ---- Calcula el total según las materias marcadas (aplica combos) ---- */
function calcularTotal(mats){
  if(!mats||!mats.length)return {total:0,detalle:[]};
  const restantes=mats.slice();
  let total=0;const detalle=[];
  /* aplicar combos primero */
  COMBOS.forEach(cb=>{
    if(cb.mats.every(m=>restantes.includes(m))){
      total+=cb.precio;
      detalle.push({tipo:'combo',nombre:cb.mats.join(' + '),precio:cb.precio});
      cb.mats.forEach(m=>{const ix=restantes.indexOf(m);if(ix>=0)restantes.splice(ix,1);});
    }
  });
  /* materias sueltas al precio individual */
  restantes.forEach(m=>{
    const p=PRECIO_MAT[m]||0;
    total+=p;
    detalle.push({tipo:'individual',nombre:m,precio:p});
  });
  return {total,detalle};
}

/* ---- Materias de una inscripción (con retrocompatibilidad) ---- */
function matsDe(i){
  if(i.mats&&i.mats.length)return i.mats;
  /* legado: derivar de cursoId + comboCursoSec */
  const out=[];
  const c=curso(i.cursoId);if(c)out.push(c.materia);
  if(i.comboCursoSec){const cs=curso(i.comboCursoSec);if(cs&&!out.includes(cs.materia))out.push(cs.materia);}
  return out;
}
/* ---- Nombre legible de la inscripción ---- */
function nombreInsc(i){
  const mats=matsDe(i);
  if(!mats.length)return 'Sin materias';
  if(mats.length===1)return mats[0];
  return mats.join(' + ');
}
function cursoDeMat(mat){
  return db.cursos.find(c=>c.materia===mat&&c.estatus==='Activo')||db.cursos.find(c=>c.materia===mat)||null;
}

/* ======================================================================
   MIGRACIÓN: consolidar TODAS las inscripciones de cada alumno en UNA sola
   ====================================================================== */
function migrarAFichaUnica(){
  let fusionados=0;
  const porAlumno={};
  db.insc.forEach(i=>{if(i.estado!=='Baja'){(porAlumno[i.alumnoId]=porAlumno[i.alumnoId]||[]).push(i);}});

  Object.keys(porAlumno).forEach(aid=>{
    const lista=porAlumno[aid];
    /* recolectar TODAS las materias del alumno */
    const matsSet=[];
    lista.forEach(i=>matsDe(i).forEach(m=>{if(!matsSet.includes(m))matsSet.push(m);}));
    if(!matsSet.length)return;
    /* ordenar según MATS_ORDEN */
    const mats=MATS_ORDEN.filter(m=>matsSet.includes(m));

    /* si ya hay UNA sola inscripción y ya tiene mats bien, solo asegurar meta */
    if(lista.length===1&&lista[0].mats&&lista[0].mats.length===mats.length)return;

    /* elegir la inscripción principal: la más antigua */
    const principal=lista.slice().sort((a,b)=>(a.id||0)-(b.id||0))[0];
    const otras=lista.filter(i=>i.id!==principal.id);

    /* mover TODOS los pagos de las otras a la principal */
    otras.forEach(o=>{db.pagos.filter(p=>p.inscId===o.id).forEach(p=>{p.inscId=principal.id;});});

    /* conservar el plan de pagos más específico y notas */
    otras.forEach(o=>{
      if(o.numPagos&&!principal.numPagos)principal.numPagos=o.numPagos;
      if(o.bit&&o.bit.length)principal.bit=[].concat(principal.bit||[],o.bit);
      if(o.rep&&!principal.rep)principal.rep=o.rep;
    });

    /* configurar la ficha única */
    principal.mats=mats;
    const cu=cursoDeMat(mats[0]);
    if(cu)principal.cursoId=cu.id;
    const calc=calcularTotal(mats);
    /* respetar meta manual si es mayor (precios especiales); si no, usar la calculada */
    principal.meta=calc.total;
    principal.numPagos=principal.numPagos||3;
    /* limpiar campos del modelo viejo de combo */
    delete principal.combo;delete principal.comboNombre;delete principal.comboMats;
    delete principal.comboCursoSec;delete principal.comb0Ayax;delete principal.incluidaEnCombo;

    /* eliminar las otras inscripciones */
    const idsOtras=otras.map(o=>o.id);
    db.insc=db.insc.filter(i=>idsOtras.indexOf(i.id)<0);
    fusionados+=otras.length;
  });

  if(fusionados){
    logA('Unificó '+fusionados+' inscripción(es) en fichas únicas por alumno');
    save();
  }
  return fusionados;
}
