/* ============ 2) ESTADO DE CUENTA POR ALUMNO (PDF imprimible) ============ */
function estadoCuenta(aid){
  const a=alumno(aid);if(!a){toast('Alumno no encontrado.','err');return;}
  const ins=db.insc.filter(i=>i.alumnoId===aid&&i.estado!=='Baja');
  if(!ins.length){toast('Este alumno no tiene inscripciones activas.','err');return;}
  const i=ins[0];
  const pagos=db.pagos.filter(p=>p.inscId===i.id&&!p.anulado).sort((x,y)=>(x.fecha||'').localeCompare(y.fecha||''));
  const pg=pagos.reduce((s,p)=>s+(+p.monto||0),0);
  const r=Math.max(0,(+i.meta||0)-pg);
  const calc=calcularTotal(matsDe(i));
  const fechaL=new Date().toLocaleDateString('es-MX',{day:'numeric',month:'long',year:'numeric'});
  const folio='EC-'+String(a.id).slice(-6)+'-'+hoy().replace(/-/g,'').slice(4);
  const detalleHtml=calc.detalle.map(d=>'<tr><td>'+(d.tipo==='combo'?'🔗 Combo '+d.nombre:'📘 '+d.nombre)+'</td><td class="num">'+money(d.precio)+'</td></tr>').join('');
  const pagosHtml=pagos.length?pagos.map(p=>'<tr><td>'+fdate(p.fecha)+'</td><td>'+esc(p.metodo||'—')+'</td><td>'+esc(p.ref||'—')+'</td><td class="num">'+money(p.monto)+'</td></tr>').join(''):'<tr><td colspan="4" style="text-align:center;color:#8A96A8">Sin pagos registrados aún</td></tr>';
  const doc='<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Estado de cuenta · '+esc(nombreA(a))+'</title><style>'+
  'body{font-family:"Segoe UI",Arial,sans-serif;background:#EEF2F7;color:#1B2A41;margin:0;padding:22px}'+
  '.hoja{max-width:680px;margin:0 auto;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 20px 60px rgba(4,45,90,.25);border-top:5px solid #C8A84B}'+
  '.band{background:linear-gradient(120deg,#0B4076,#042D5A 60%,#021D3D);color:#fff;padding:24px 32px}'+
  '.band h1{margin:0;font-size:22px;letter-spacing:.5px}.band .sub{opacity:.85;font-size:12.5px;margin-top:4px}'+
  '.cuerpo{padding:26px 32px}'+
  'table{width:100%;border-collapse:collapse;margin:10px 0 18px}th{text-align:left;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#5A6B84;padding:7px 8px;border-bottom:2px solid #E2E7F0}td{padding:8px;border-bottom:1px solid #EEF1F7;font-size:13.5px}.num{text-align:right;font-weight:700}'+
  '.tot{display:flex;gap:14px;flex-wrap:wrap;margin:14px 0}'+
  '.tc{flex:1;min-width:140px;border-radius:12px;padding:14px;text-align:center}'+
  '.tc .l{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;font-weight:800;opacity:.75}.tc .v{font-size:22px;font-weight:800;margin-top:4px}'+
  '.verde{background:#EEF6EE;color:#1E6B3C}.rojo{background:#FDECEE;color:#B02A37}.azul{background:#EDF3FB;color:#0A3D73}'+
  '.foot{padding:16px 32px;background:#F7F9FC;font-size:11.5px;color:#8A96A8;text-align:center}'+
  '@media print{body{background:#fff;padding:0}.hoja{box-shadow:none;border-radius:0}}'+
  '</style></head><body><div class="hoja">'+
  '<div class="band" style="display:flex;align-items:center;gap:18px"><img src="'+LOGO_MS+'" style="width:74px;height:74px;flex-shrink:0"><div><h1>MEDSTUDENTS</h1><div class="sub">We enrich your potential · Estado de cuenta · Folio '+folio+' · '+fechaL+'</div></div></div>'+
  '<div class="cuerpo">'+
  '<h2 style="margin:0 0 2px;color:#042D5A">'+esc(nombreA(a))+'</h2>'+
  '<div style="color:#5A6B84;font-size:13px;margin-bottom:16px">'+esc(a.email||'')+(a.whatsapp?' · '+esc(a.whatsapp):'')+'</div>'+
  '<h3 style="color:#042D5A;font-size:14px;letter-spacing:.5px">INSCRIPCIÓN</h3>'+
  '<table><thead><tr><th>Concepto</th><th style="text-align:right">Importe</th></tr></thead><tbody>'+detalleHtml+
  '<tr><td style="font-weight:800;color:#042D5A">TOTAL DEL CURSO</td><td class="num" style="font-size:15px;color:#042D5A">'+money(i.meta)+'</td></tr></tbody></table>'+
  '<h3 style="color:#042D5A;font-size:14px;letter-spacing:.5px">PAGOS REALIZADOS</h3>'+
  '<table><thead><tr><th>Fecha</th><th>Método</th><th>Referencia</th><th style="text-align:right">Monto</th></tr></thead><tbody>'+pagosHtml+'</tbody></table>'+
  '<div class="tot">'+
  '<div class="tc azul"><div class="l">Total del curso</div><div class="v">'+money(i.meta)+'</div></div>'+
  '<div class="tc verde"><div class="l">Pagado</div><div class="v">'+money(pg)+'</div></div>'+
  '<div class="tc '+(r>0?'rojo':'verde')+'"><div class="l">'+(r>0?'Saldo pendiente':'Estatus')+'</div><div class="v">'+(r>0?money(r):'LIQUIDADO ✓')+'</div></div>'+
  '</div>'+
  (r>0&&i.proxPago?'<div style="font-size:13px;color:#5A6B84">Próximo pago sugerido: <b>'+fdate(i.proxPago)+'</b></div>':'')+
  '</div>'+
  '<div class="foot">MedStudents · medstudents.page · Documento informativo, no es factura fiscal.<br>Para enviarlo por WhatsApp: presione Imprimir → Guardar como PDF.</div>'+
  '</div><script>window.onload=()=>setTimeout(()=>window.print(),400);<\/script></body></html>';
  const w=window.open('','_blank');
  if(!w){toast('Permite las ventanas emergentes para generar el PDF.','err');return;}
  w.document.write(doc);w.document.close();
  logA('Generó estado de cuenta de '+nombreA(a));
}

/* ============ 3) PANEL DE METAS DEL SEMESTRE (card en Dashboard) ============ */
function cardMetasSemestre(){
  const insAct=db.insc.filter(i=>i.estado==='Activa');
  const metaTotal=insAct.reduce((s,i)=>s+(+i.meta||0),0);
  const cobrado=insAct.reduce((s,i)=>s+pagado(i.id),0);
  const pend=Math.max(0,metaTotal-cobrado);
  const pct=metaTotal>0?Math.round(cobrado/metaTotal*100):0;
  /* proyección: ritmo de cobro de los últimos 30 días */
  const hace30=(function(){const d=new Date();d.setDate(d.getDate()-30);return d.toISOString().slice(0,10);})();
  const cobrado30=db.pagos.filter(p=>!p.anulado&&p.fecha&&p.fecha>=hace30).reduce((s,p)=>s+(+p.monto||0),0);
  const ritmoDiario=cobrado30/30;
  const diasParaMeta=ritmoDiario>0?Math.ceil(pend/ritmoDiario):null;
  const fechaMeta=diasParaMeta?(function(){const d=new Date();d.setDate(d.getDate()+diasParaMeta);return d.toLocaleDateString('es-MX',{day:'numeric',month:'long'});})():null;
  return card('Meta del semestre · 2026B','<span class="pill '+(pct>=70?'ok':(pct>=40?'gold':'bad'))+'">'+pct+'% cobrado</span>',
    '<div class="bd">'+
    '<div style="display:flex;gap:22px;flex-wrap:wrap;margin-bottom:14px">'+
    '<div><div style="font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft);font-weight:700">Meta total</div><div style="font-size:23px;font-weight:800;color:var(--navy)">'+money(metaTotal)+'</div></div>'+
    '<div><div style="font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft);font-weight:700">Cobrado</div><div style="font-size:23px;font-weight:800;color:var(--ok)">'+money(cobrado)+'</div></div>'+
    '<div><div style="font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft);font-weight:700">Falta</div><div style="font-size:23px;font-weight:800;color:var(--red)">'+money(pend)+'</div></div>'+
    '</div>'+
    '<div class="bar-track" style="height:20px"><div class="bar-fill" style="width:'+pct+'%;background:linear-gradient(90deg,#C8A84B,#1E9E6A)"></div></div>'+
    '<div class="tsub" style="margin-top:8px;white-space:normal">'+
    (cobrado30>0?'Ritmo del último mes: <b>'+money(Math.round(cobrado30))+'</b> cobrados ('+money(Math.round(ritmoDiario))+'/día). '+(fechaMeta&&pend>0?'A este ritmo, la meta se alcanza alrededor del <b>'+fechaMeta+'</b>.':(pend<=0?'🎉 ¡Meta alcanzada!':'')):'Registra pagos para calcular el ritmo de cobro.')+
    '</div></div>');
}

/* Cuentas destino de MedStudents: terminación → banco */
function bancoPorCuenta(dig){
  const d=String(dig||'').replace(/\D/g,'');
  if(!d)return '';
  const l4=d.slice(-4), l3=d.slice(-3);
  /* Banamex: tarjeta •1298 (o •298) y CLABE •2099 (o •099) */
  if(l4==='1298'||l3==='298'||l4==='2099'||l3==='099')return 'Banamex';
  /* Santander: cuenta •9632 */
  if(l4==='9632'||l3==='632')return 'Santander';
  return '';
}
/* ======================================================================
   MÓDULO CONCILIACIÓN BANCARIA: cotejar pagos vs estado de cuenta
   ====================================================================== */
let concFiltro={periodo:'mes',banco:'',metodo:'',estado:''};
function setConcF(campo,v){concFiltro[campo]=v;render();}

function toggleConciliado(pid){
  const p=db.pagos.find(x=>x.id===pid);if(!p)return;
  p.conciliado=!p.conciliado;
  if(p.conciliado)p.conciliadoFecha=hoy();else delete p.conciliadoFecha;
  logA((p.conciliado?'Concilió':'Desconcilió')+' pago #'+pid+' ('+money(p.monto)+')');
  save();render();
}

function vConciliacion(){
  const hh=hoy();
  let desde;
  if(concFiltro.periodo==='semana'){const d=new Date();d.setDate(d.getDate()-7);desde=d.toISOString().slice(0,10);}
  else if(concFiltro.periodo==='mes'){desde=hh.slice(0,7)+'-01';}
  else if(concFiltro.periodo==='mesant'){const d=new Date();d.setMonth(d.getMonth()-1);desde=d.toISOString().slice(0,7)+'-01';}
  else desde='2000-01-01';
  let hasta='2999-12-31';
  if(concFiltro.periodo==='mesant'){hasta=hh.slice(0,7)+'-01';}

  let lista=db.pagos.filter(p=>!p.anulado&&p.fecha&&p.fecha>=desde&&p.fecha<hasta);
  if(concFiltro.banco)lista=lista.filter(p=>(p.banco||'')===concFiltro.banco);
  if(concFiltro.metodo)lista=lista.filter(p=>(p.metodo||'')===concFiltro.metodo);
  if(concFiltro.estado==='pend')lista=lista.filter(p=>!p.conciliado);
  if(concFiltro.estado==='ok')lista=lista.filter(p=>p.conciliado);
  lista.sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||'')||b.id-a.id);

  const total=lista.reduce((s,p)=>s+numMX(p.monto),0);
  const conc=lista.filter(p=>p.conciliado);
  const totalConc=conc.reduce((s,p)=>s+(+p.monto||0),0);
  const totalPend=total-totalConc;

  /* bancos presentes para el filtro */
  const bancosSet=[...new Set(db.pagos.filter(p=>!p.anulado&&p.banco).map(p=>p.banco))].sort();

  const filas=lista.map(p=>{
    const i=insc(p.inscId),a=i?alumno(i.alumnoId):null;
    const folio='MS-'+String(p.id).slice(-6);
    const tel=a&&a.whatsapp?String(a.whatsapp):'';
    return '<tr'+(p.conciliado?' style="background:#F1F8F1"':'')+'>'+
      '<td style="text-align:center"><input type="checkbox" '+(p.conciliado?'checked':'')+' onchange="MSADM.toggleConciliado('+p.id+')" style="width:19px;height:19px;cursor:pointer;accent-color:#1E9E6A"></td>'+
      '<td><div class="tname" style="cursor:pointer" onclick="MSADM.ficha('+(a?a.id:0)+')">'+esc(a?nombreA(a):'?')+'</div>'+
        '<div class="tsub">'+esc(i?nombreInsc(i):'')+'</div></td>'+
      '<td class="tsub">'+esc(tel||'—')+'</td>'+
      '<td>'+fdate(p.fecha)+'</td>'+
      '<td class="tsub">'+esc(p.ref||folio)+'</td>'+
      '<td><span class="pill navy">'+esc(p.metodo||'—')+'</span></td>'+
      '<td>'+(p.banco?'<span class="pill gold">'+esc(p.banco)+'</span>':'<button class="btn sm ghost" onclick="MSADM.asignarBanco('+p.id+')">+ banco</button>')+'</td>'+
      '<td class="num"><b>'+money(p.monto)+'</b></td>'+
      '<td>'+(p.compReportado?'<a class="wa" href="'+esc(p.compReportado)+'" target="_blank" onclick="MSADM.verComprobante(event,\''+esc(p.compReportado)+'\')">🖼</a>':'<span class="tsub">—</span>')+'</td>'+
    '</tr>';
  }).join('');

  const body=lista.length
    ?'<div class="tbl-wrap"><table><thead><tr><th style="width:40px">✓</th><th>Alumno</th><th>WhatsApp</th><th>Fecha</th><th>Folio / Ref</th><th>Método</th><th>Banco</th><th class="num">Monto</th><th>🖼</th></tr></thead><tbody>'+filas+'</tbody></table></div>'
    :'<div class="empty"><div class="big">🏦</div><b>Sin pagos en este filtro</b><p>Ajusta el periodo, banco o método.</p></div>';

  return topbar('Conciliación bancaria','Coteja cada pago contra el estado de cuenta del banco y marca la casilla al confirmarlo',
    '<select class="filter" onchange="MSADM.setConcF(\'periodo\',this.value)">'+
      '<option value="semana"'+(concFiltro.periodo==='semana'?' selected':'')+'>Última semana</option>'+
      '<option value="mes"'+(concFiltro.periodo==='mes'?' selected':'')+'>Este mes</option>'+
      '<option value="mesant"'+(concFiltro.periodo==='mesant'?' selected':'')+'>Mes anterior</option>'+
      '<option value="todo"'+(concFiltro.periodo==='todo'?' selected':'')+'>Todos</option>'+
    '</select>'+
    '<select class="filter" onchange="MSADM.setConcF(\'banco\',this.value)"><option value="">Todos los bancos</option>'+
      bancosSet.map(b=>'<option value="'+esc(b)+'"'+(concFiltro.banco===b?' selected':'')+'>'+esc(b)+'</option>').join('')+'</select>'+
    '<select class="filter" onchange="MSADM.setConcF(\'metodo\',this.value)"><option value="">Todos los métodos</option>'+
      ['Transferencia','Depósito','Efectivo','Tarjeta','Otro'].map(m=>'<option value="'+m+'"'+(concFiltro.metodo===m?' selected':'')+'>'+m+'</option>').join('')+'</select>'+
    '<select class="filter" onchange="MSADM.setConcF(\'estado\',this.value)">'+
      '<option value="">Todos</option><option value="pend"'+(concFiltro.estado==='pend'?' selected':'')+'>⬜ Por conciliar</option><option value="ok"'+(concFiltro.estado==='ok'?' selected':'')+'>✅ Conciliados</option></select>'+
    '<button class="btn" onclick="MSADM.expConciliacion()">📊 Excel</button>')+
    '<div class="hero" style="margin-bottom:18px">'+
      '<div class="hcard ing"><div class="hlab">💰 Total del periodo</div><div class="hval">'+moneyH(total)+'</div><div class="hsub">'+lista.length+' pagos</div></div>'+
      '<div class="hcard" style="border-left:4px solid #1E9E6A"><div class="hlab">✅ Conciliado</div><div class="hval" style="color:#1E9E6A">'+moneyH(totalConc)+'</div><div class="hsub">'+conc.length+' confirmados en banco</div></div>'+
      '<div class="hcard pend"><div class="hlab">⬜ Por conciliar</div><div class="hval">'+moneyH(totalPend)+'</div><div class="hsub">'+(lista.length-conc.length)+' pendientes de cotejar</div></div>'+
    '</div>'+
    card('Pagos ('+lista.length+')','',body);
}

function asignarBanco(pid){
  const p=db.pagos.find(x=>x.id===pid);if(!p)return;
  const b=prompt('¿A qué banco llegó este pago?\n(Banamex, BBVA, Banorte, Santander, HSBC, Nu, Mercado Pago, Otro)',p.banco||'');
  if(b===null)return;
  p.banco=b.trim();
  save();render();
}

function expConciliacion(){
  loadXLSX(function(){
    const hh=hoy();
    let desde;
    if(concFiltro.periodo==='semana'){const d=new Date();d.setDate(d.getDate()-7);desde=d.toISOString().slice(0,10);}
    else if(concFiltro.periodo==='mes'){desde=hh.slice(0,7)+'-01';}
    else if(concFiltro.periodo==='mesant'){const d=new Date();d.setMonth(d.getMonth()-1);desde=d.toISOString().slice(0,7)+'-01';}
    else desde='2000-01-01';
    let hasta='2999-12-31';
    if(concFiltro.periodo==='mesant'){hasta=hh.slice(0,7)+'-01';}
    let lista=db.pagos.filter(p=>!p.anulado&&p.fecha&&p.fecha>=desde&&p.fecha<hasta);
    if(concFiltro.banco)lista=lista.filter(p=>(p.banco||'')===concFiltro.banco);
    if(concFiltro.metodo)lista=lista.filter(p=>(p.metodo||'')===concFiltro.metodo);
    lista.sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||''));
    const aoa=[['Conciliado','Alumno','WhatsApp','Fecha','Folio/Referencia','Método','Banco','Monto','Recibió','Materias']];
    lista.forEach(p=>{
      const i=insc(p.inscId),a=i?alumno(i.alumnoId):null;
      aoa.push([p.conciliado?'SÍ':'NO',a?nombreA(a):'?',a?(a.whatsapp||''):'',p.fecha||'',p.ref||('MS-'+String(p.id).slice(-6)),p.metodo||'',p.banco||'',+p.monto||0,p.recibio||'',i?nombreInsc(i):'']);
    });
    const wb=XLSX.utils.book_new();
    const ws=XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols']=[{wch:10},{wch:32},{wch:14},{wch:11},{wch:16},{wch:13},{wch:14},{wch:10},{wch:10},{wch:28}];
    XLSX.utils.book_append_sheet(wb,ws,'Conciliación');
    XLSX.writeFile(wb,'conciliacion-medstudents-'+hoy()+'.xlsx');
    logA('Exportó conciliación bancaria a Excel');
    toast('📊 Excel de conciliación descargado ✓');
  });
}
Object.assign(window.MSADM,{vConciliacion,setConcF,toggleConciliado,asignarBanco,expConciliacion});

/* ======================================================================
   MÓDULO PDF POR BANCO: reportes imprimibles para cotejar con cada banco
   ====================================================================== */
function pagosDeBanco(grupo,desde,hasta){
  return db.pagos.filter(p=>{
    if(p.anulado)return false;
    if(p.fecha&&(p.fecha<desde||p.fecha>=hasta))return false;
    const b=(p.banco||'').toLowerCase(), m=(p.metodo||'').toLowerCase(), rec=(p.recibio||'').toLowerCase();
    if(grupo==='banamex')return b.includes('banamex');
    if(grupo==='santander')return b.includes('santander');
    if(grupo==='efectivo')return m==='efectivo'||b.includes('efectivo')||rec==='oficina';
    return false;
  }).sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||''));
}

function pdfBanco(grupo){
  const hh=hoy();
  let desde;
  if(compFiltroPeriodo==='semana'){const d=new Date();d.setDate(d.getDate()-7);desde=d.toISOString().slice(0,10);}
  else if(compFiltroPeriodo==='mes'){desde=hh.slice(0,7)+'-01';}
  else desde='2000-01-01';

    'Curso: '+nombreInsc(i)+'\n'+
    (r>0?('Saldo restante: '+money(r)+(i.proxPago?'\nProximo pago: '+fdate(i.proxPago):'')):'Curso LIQUIDADO. Gracias por tu confianza.')+
    '\n- MedStudents';

    '</div>',
  function(){closeModal();},'Cerrar sin enviar');
}

/* ---- 2) SEMÁFORO DE RIESGO ---- */
function riesgoDe(i){
  const d=dueDate(i);if(!d)return null;
  const hh=hoy();if(d>=hh)return null;
  const dias=Math.round((new Date(hh)-new Date(d))/86400000);
  return dias>30?'rojo':(dias>0?'amarillo':null);
}
function cardRiesgo(){
  const rojos=[],amarillos=[];
  db.insc.filter(i=>i.estado==='Activa'&&resto(i)>0).forEach(i=>{
    const rg=riesgoDe(i);const a=alumno(i.alumnoId);if(!a)return;
    if(rg==='rojo')rojos.push({i,a,r:resto(i)});
    else if(rg==='amarillo')amarillos.push({i,a,r:resto(i)});
  });
  const mR=rojos.reduce((s,x)=>s+x.r,0), mA=amarillos.reduce((s,x)=>s+x.r,0);
  const filaR=rojos.sort((x,y)=>y.r-x.r).slice(0,5).map(x=>{
    const tel=String(x.a.whatsapp||'').replace(/\D/g,'');
    return '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)">'+
      '<div style="cursor:pointer" onclick="MSADM.ficha('+x.a.id+')"><b style="color:var(--navy);font-size:13px">'+esc(nombreA(x.a))+'</b><div class="tsub">'+esc(nombreInsc(x.i))+'</div></div>'+
      '<div style="display:flex;align-items:center;gap:8px"><b style="color:var(--red)">'+money(x.r)+'</b>'+
      (tel?'<a class="wa" href="https://wa.me/52'+tel.slice(-10)+'" target="_blank">📲</a>':'')+'</div></div>';
  }).join('');
  return card('Situación económica: urgente','<span class="pill bad">'+rojos.length+' críticos</span> <span class="pill warn">'+amarillos.length+' en alerta</span>',
    '<div class="bd">'+
    '<div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px">'+
    '<div style="flex:1;min-width:130px;background:#FDECEE;border-radius:12px;padding:12px;text-align:center"><div style="font-size:11px;font-weight:800;letter-spacing:.5px;color:#B02A37">🔴 +30 DÍAS (2+ CUOTAS)</div><div style="font-size:21px;font-weight:800;color:#B02A37">'+money(mR)+'</div><div class="tsub">'+rojos.length+' alumnos</div></div>'+
    '<div style="flex:1;min-width:130px;background:#FFF6E5;border-radius:12px;padding:12px;text-align:center"><div style="font-size:11px;font-weight:800;letter-spacing:.5px;color:#B87503">🟡 1-30 DÍAS</div><div style="font-size:21px;font-weight:800;color:#B87503">'+money(mA)+'</div><div class="tsub">'+amarillos.length+' alumnos</div></div>'+
    '</div>'+
    (rojos.length?'<div class="tsub" style="font-weight:700;margin-bottom:4px">Prioridad de contacto:</div>'+filaR:'<div class="tsub">🎉 Nadie con más de un mes de atraso.</div>')+
    '</div>');
}

function chkAutoRespaldo(){

  else{desde='2000-01-01';etiqueta='Histórico completo';}

  const directos=db.pagos.filter(p=>enP(p)&&recibioAyax(p));

  const doc='<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Corte Dr. Ayax</title><style>'+
  'body{font-family:"Segoe UI",Arial,sans-serif;color:#1B2A41;margin:0;padding:24px;background:#fff}'+

  'h2{font-size:14px;color:#042D5A;letter-spacing:.5px;margin:20px 0 6px}'+
  'table{width:100%;border-collapse:collapse;font-size:12px}th{background:#F3F6FB;text-align:left;padding:7px;font-size:10.5px;text-transform:uppercase;color:#5A6B84;border-bottom:2px solid #E2E7F0}td{padding:7px;border-bottom:1px solid #EEF1F7}'+
  '.tot{text-align:right;font-size:13.5px;margin:8px 0 4px}.tot b{color:#042D5A}'+
  '.res{margin-top:20px;background:#FBF7EA;border:1px solid #E5D5A3;border-radius:12px;padding:16px;font-size:14px}'+
  '.firma{margin-top:44px;display:flex;gap:60px;justify-content:center;text-align:center;font-size:12px;color:#5A6B84}'+
  '.firma div{border-top:1px solid #8A96A8;padding-top:6px;min-width:200px}'+
  '@media print{body{padding:10px}}'+
  '</style></head><body>'+
  '<div class="head"><img src="'+LOGO_MS+'" style="width:56px;height:56px"><div><h1>MEDSTUDENTS · Corte Dr. Ayax Rizo</h1>'+
  '<div class="sub">Periodo: '+etiqueta+' · Generado el '+fechaL+'</div></div></div>'+
  '<h2>A) Pagos recibidos directamente por el Dr. Ayax (Banorte / en mano)</h2>'+
  (directos.length?'<table><thead><tr><th>Fecha</th><th>Alumno</th><th>Curso</th><th>Banco/Método</th><th style="text-align:right">Monto</th></tr></thead><tbody>'+directos.map(p=>fila(p)).join('')+'</tbody></table>':'<div style="font-size:12.5px;color:#8A96A8">Sin pagos directos en el periodo.</div>')+

}

/* ===== Resumen de ingresos por concepto (materia / combo) ===== */
function cardIngresosConcepto(){
  const grupos={};
  db.insc.filter(i=>i.estado!=='Baja').forEach(i=>{
    const mats=matsDe(i);if(!mats.length)return;
    let key;
    const sorted=mats.slice().sort().join('|');
    if(mats.length===1)key='02·'+mats[0]+' (individual)';
    else if(sorted==='ANATOMÍA|HISTOLOGÍA')key='01·Combo Anatomía + Histología';
    else if(sorted==='BIOQUÍMICA|EMBRIOLOGÍA')key='01·Combo Embriología + Bioquímica';
    else key='03·Paquete '+mats.join(' + ');
    const g=grupos[key]=grupos[key]||{n:0,meta:0,cobrado:0};
    g.n++;g.meta+=(+i.meta||0);g.cobrado+=pagado(i.id);
  });
  const keys=Object.keys(grupos).sort();
  if(!keys.length)return '';
  let tMeta=0,tCob=0,tN=0;
  const filas=keys.map(k=>{
    const g=grupos[k];tMeta+=g.meta;tCob+=g.cobrado;tN+=g.n;
    const pend=Math.max(0,g.meta-g.cobrado);
    const pct=g.meta>0?Math.round(g.cobrado/g.meta*100):0;
    return '<tr>'+
      '<td style="font-weight:700;color:var(--navy)">'+esc(k.slice(3))+'</td>'+
      '<td style="text-align:center">'+g.n+'</td>'+
      '<td class="num">'+money(g.meta)+'</td>'+
      '<td class="num" style="color:#1E6B3C;font-weight:700">'+money(g.cobrado)+'</td>'+
      '<td class="num" style="color:'+(pend>0?'var(--red)':'#1E6B3C')+'">'+money(pend)+'</td>'+
      '<td style="min-width:120px"><div style="display:flex;align-items:center;gap:8px"><div class="bar-track" style="flex:1;height:8px"><div class="bar-fill" style="width:'+pct+'%;background:'+(pct>=70?'#1E9E6A':pct>=40?'#C8A84B':'#B02A37')+'"></div></div><span style="font-size:11.5px;font-weight:700;color:var(--ink-soft);min-width:34px;text-align:right">'+pct+'%</span></div></td>'+
    '</tr>';
  }).join('');
  const pctT=tMeta>0?Math.round(tCob/tMeta*100):0;
  return card('Ingresos por concepto','<span class="pill navy">'+pctT+'% del total cobrado</span>',
    '<div class="bd"><div class="tbl-wrap"><table>'+
    '<thead><tr><th>Concepto</th><th style="text-align:center">Alumnos</th><th class="num">Meta</th><th class="num">Cobrado</th><th class="num">Pendiente</th><th>Avance</th></tr></thead>'+
    '<tbody>'+filas+
    '<tr style="background:#F7FAFD"><td style="font-weight:800;color:var(--navy)">TOTAL</td><td style="text-align:center;font-weight:800">'+tN+'</td><td class="num" style="font-weight:800">'+money(tMeta)+'</td><td class="num" style="font-weight:800;color:#1E6B3C">'+money(tCob)+'</td><td class="num" style="font-weight:800;color:var(--red)">'+money(Math.max(0,tMeta-tCob))+'</td><td></td></tr>'+
    '</tbody></table></div></div>');
}

/* Normalizar montos guardados como texto (comas, símbolos) — corrige sumas */
function normalizarMontos(){
  let n=0;
  (db.pagos||[]).forEach(p=>{const v=numMX(p.monto);if(p.monto!==v){p.monto=v;n++;}});
  (db.egresos||[]).forEach(g=>{const v=numMX(g.monto);if(g.monto!==v){g.monto=v;n++;}});
  (db.insc||[]).forEach(i=>{const v=numMX(i.meta);if(i.meta!==v){i.meta=v;n++;}});
  if(n){logA('Normalizó '+n+' monto(s) con formato de texto');save();}
  return n;
}

/* ===== AUTO-IMPORTACIÓN del Forms: procesa solo (usa mapeos guardados) ===== */
async function autoImportForms(){
  try{
    if(!srv.url)return;
    let arr=null;
    try{const r=await fetch(srv.url+(srv.url.indexOf('?')>=0?'&':'?')+'token='+encodeURIComponent(srv.key)+'&action=forms');const j=await r.json();if(j.ok&&j.rows)arr=j.rows;}catch(e){}
    if(!arr||!arr.length)return;
    const seen={};let nuevos=0,insN=0,sinMapa=0;const compTareas=[];
    db.formsComp=db.formsComp||{};
    arr.forEach(r=>{
      const nombre=String(r.n||'').trim(),apellido=String(r.a||'').trim();
      const email=String(r.e||'').trim().toLowerCase(),tel=digits(String(r.w||'')).slice(-10);
      const cursoTxt=String(r.c||'').trim();
      const estatus=/irregular/i.test(r.s||'')?'Irregular':(/regular/i.test(r.s||'')?'Regular':'');
      if(!nombre||(!email&&!tel))return;
      const key=email||tel;if(seen[key])return;seen[key]=1;
      let a=db.alumnos.find(x=>(x.email&&email&&x.email.toLowerCase()===email)||(tel&&digits(x.whatsapp).slice(-10)===tel));
      const md=mapDef(cursoTxt);
      const compId=String(r.comp||'').trim();
      if(cursoTxt&&!md.c.length){
        if(compId&&a)compTareas.push({fileId:compId,alumnoId:a.id,cursoTxt:cursoTxt});
        sinMapa++;return; /* opción del Forms sin mapeo: requiere revisión manual */
      }
      const cs=md.c.map(cid=>curso(cid)).filter(Boolean);
      const matsNuevas=MATS_ORDEN.filter(mm=>cs.some(c=>c.materia===mm));
      if(!a){
        a={id:uid(),nombre:nombre,apellido:apellido,email:email,whatsapp:String(r.w||'').trim(),estatus:estatus,w:false,p:false,b:false,alta:hoy(),nota:'Alta automática vía Google Forms'};
        db.alumnos.push(a);nuevos++;
      }else if(estatus&&!a.estatus)a.estatus=estatus;
      if(matsNuevas.length){
        let iu=db.insc.find(i=>i.alumnoId===a.id&&i.estado!=='Baja');
        if(iu){
          const matsAct=matsDe(iu);
          const comb=MATS_ORDEN.filter(mm=>matsAct.includes(mm)||matsNuevas.includes(mm));
          if(comb.length!==matsAct.length){
            iu.mats=comb;
            const cu0=cursoDeMat(comb[0]);if(cu0)iu.cursoId=cu0.id;
            iu.meta=calcularTotal(comb).total;
            if(comb.length<=1&&(+iu.numPagos||0)>2)iu.numPagos=2;
            insN++;
          }
        }else{
          const cu0=cursoDeMat(matsNuevas[0]);
          if(cu0){
            db.insc.push({id:uid(),alumnoId:a.id,cursoId:cu0.id,mats:matsNuevas,
              meta:calcularTotal(matsNuevas).total,numPagos:(matsNuevas.length<=1?2:3),
              fecha:hoy(),proxPago:addMonth(hoy()),profesor:'Dr. Abdi',estado:'Activa',
              nota:'Inscrito automáticamente vía Google Forms ('+cursoTxt+')'});
            insN++;
          }
        }
      }
      if(compId&&a&&!db.formsComp[compId])compTareas.push({fileId:compId,alumnoId:a.id,cursoTxt:cursoTxt});
    });
    if(nuevos||insN){
      logA('AUTO-Forms: '+nuevos+' alumno(s) nuevos, '+insN+' inscripción(es)');
      save();render();
      toast('Forms sincronizado: '+nuevos+' alumno(s) nuevo(s), '+insN+' inscripción(es) creada(s) automáticamente.');
    }
    if(sinMapa){
      toast('Hay '+sinMapa+' respuesta(s) del Forms con una opción de curso sin mapear. Ve a Google Forms para asignarles curso (solo la primera vez).','err');
    }
    /* Procesar comprobantes adjuntos en el Forms (máx. 5 por carga) */
    if(compTareas.length){
      let hechos=0;
      for(const tarea of compTareas.slice(0,5)){
        try{const ok=await procesarCompForms(tarea);if(ok)hechos++;}catch(e){console.log('compForms',e);}
      }
      if(hechos)toast(hechos+' comprobante(s) adjuntos en el Forms fueron leídos y enviados a «Pagos por validar».');
      if(compTareas.length>5)toast('Quedan '+(compTareas.length-5)+' comprobantes del Forms; se procesarán en la próxima carga del panel.');
    }
  }catch(e){console.log('autoImportForms',e);}
}
/* Lee un comprobante adjunto del Forms, lo interpreta con IA y lo manda a Pagos por validar */
async function procesarCompForms(t){
  if(!srv.url||!sbClient||!sbInited)return false;
  db.formsComp=db.formsComp||{};
  if(db.formsComp[t.fileId])return false;
  const a=alumno(t.alumnoId);if(!a)return false;
  const i=db.insc.find(x=>x.alumnoId===a.id&&x.estado!=='Baja')||null;
  /* 0) Candado en la nube: ¿este archivo ya fue reportado antes (aunque la memoria local se haya perdido)? */
  try{
    const{data:ya}=await sbClient.from('ms_pagos_reportados').select('id').eq('file_id',t.fileId).limit(1);
    if(ya&&ya.length){db.formsComp[t.fileId]=1;save();return false;}
  }catch(e){}
  /* 1) Traer la imagen desde Google Drive vía Apps Script */
  const sep=srv.url.indexOf('?')>=0?'&':'?';
  let img=null;
  try{
    const r=await fetch(srv.url+sep+'token='+encodeURIComponent(srv.key)+'&action=compimg&id='+encodeURIComponent(t.fileId));
    const j=await r.json();
    if(j&&j.ok&&j.b64)img={b64:j.b64,type:j.type||'image/jpeg'};
  }catch(e){}
  if(!img)return false;
  /* 2) Leer datos con la IA (Edge Function) */
  let d={};
  const edge=(db.cfg&&db.cfg.edgeUrl)||'';
  if(edge){
    try{
      const rr=await fetch(edge,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({imageBase64:img.b64,mediaType:img.type})});
      const jj=await rr.json();
      if(jj&&jj.ok&&jj.datos)d=jj.datos;
    }catch(e){}
  }
  /* 3) Guardar la imagen en el bucket para tenerla permanente */
  let url='';
  try{url=await Promise.race([subirComprobante('data:'+img.type+';base64,'+img.b64),new Promise(res=>setTimeout(()=>res(''),15000))]);}catch(e){}
  /* 4) Registrar como pago pendiente de validación */
  const banco=bancoPorCuenta(d.cuentaDestino)||(/banorte/i.test(String(d.banco||''))?'Banorte':'');
  try{
    const{error}=await sbClient.from('ms_pagos_reportados').insert({
      nombre:nombreA(a),whatsapp:a.whatsapp||'',email:a.email||'',
      curso:i?nombreInsc(i):t.cursoTxt,
      monto:numMX(d.monto),metodo:'Transferencia',
      referencia:String(d.ref||''),folio:String(d.folio||''),banco:banco,
      fecha_pago:d.fecha||hoy(),comprobante:url,
      nota:'Comprobante adjunto en el Forms de inscripción (lectura automática)',
      alumno_id:a.id,insc_id:i?i.id:null,estado:'pendiente',file_id:t.fileId
    });
    if(error)throw error;
  }catch(e){console.log('insert reporte',e);return false;}
  db.formsComp[t.fileId]=1;save();
  logA('Comprobante del Forms de '+nombreA(a)+' leído y enviado a validación');
  return true;
}
Object.assign(window.MSADM,{autoImportForms});
